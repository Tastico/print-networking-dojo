<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Print Networking Dojo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23c2410c'/><text x='16' y='22' font-family='monospace' font-size='18' font-weight='700' text-anchor='middle' fill='%23fff'>D</text></svg>">
<style>
/* Dojo: desktop-app shell (title bar, tab row, status bar), dense, light and dark. */
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1f24; --muted: #5d6370; --line: #dcdad3;
  --accent: #c2410c; --accent-ink: #ffffff; --ok: #15803d; --ok-bg: #e8f5ec; --no: #b91c1c; --no-bg: #fbeaea;
  --tried: #a16207; --sel: #fff1e8; --code: #f0eee8; --radius: 8px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "DejaVu Sans Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #15171b; --panel: #1d2026; --ink: #e6e7ea; --muted: #9aa1ad; --line: #30343c;
    --accent: #f97316; --accent-ink: #15171b; --ok: #4ade80; --ok-bg: #12291b; --no: #f87171; --no-bg: #2e1717;
    --tried: #facc15; --sel: #2c2118; --code: #262a31; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); }
a { color: var(--accent); }
#app { min-height: 100vh; display: flex; flex-direction: column; }

.titlebar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.logo { width: 30px; height: 30px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 700 17px var(--mono); }
.titles { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.tagline { color: var(--muted); font-size: 13px; }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 12px 0; background: var(--panel); border-bottom: 1px solid var(--line); }
.tabs a { padding: 10px 14px; min-height: 44px; display: inline-flex; align-items: center; text-decoration: none; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 500; }
.tabs a[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .more { display: none; position: relative; }
.tabs .more summary { list-style: none; padding: 10px 14px; min-height: 44px; display: inline-flex; align-items: center; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; }
.tabs .more summary::-webkit-details-marker { display: none; }
.tabs .more summary::after { content: ""; margin-inline-start: 6px; border: 5px solid transparent; border-top-color: currentColor; transform: translateY(3px); }
.tabs .more summary[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .menu { position: absolute; inset-inline-end: 0; top: 100%; z-index: 5; min-width: 180px; display: flex; flex-direction: column; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
.tabs .menu a { border-bottom: 0; border-radius: 6px; }
.tabs .menu a[aria-selected="true"] { background: var(--sel); }

main { flex: 1; width: 100%; max-width: 1100px; margin: 0 auto; padding: 20px 16px 32px; }
h1 { font-size: 22px; margin: 4px 0 6px; }
h2 { font-size: 18px; margin: 18px 0 8px; }
h3 { font-size: 16px; margin: 16px 0 6px; }
.lead, .src { color: var(--muted); margin: 0 0 14px; }
.empty { padding: 24px 16px; color: var(--muted); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
.card { display: flex; gap: 12px; padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); color: inherit; text-decoration: none; }
a.card:hover { border-color: var(--accent); }
.card.done { border-left: 4px solid var(--ok); }
.card.tried { border-left: 4px solid var(--tried); }
.card .num { font: 700 18px var(--mono); color: var(--muted); min-width: 28px; }
.card .body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.card .sum { color: var(--muted); font-size: 14px; }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: var(--muted); align-items: center; }
.card .st { font-weight: 600; }
.card.done .st { color: var(--ok); }
.award { flex-direction: column; gap: 4px; }
.award.todo { opacity: 0.6; }
.scen { display: block; margin-bottom: 10px; }
.scen h2 { margin-top: 0; }

.badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; background: var(--code); color: var(--muted); }
.badge.lvl-beginner { color: var(--ok); }
.badge.lvl-intermediate { color: var(--tried); }
.badge.lvl-advanced, .badge.lvl-expert { color: var(--no); }
.badge.draft { background: var(--sel); color: var(--accent); }
.badge.ok { background: var(--ok-bg); color: var(--ok); }

.crumbs { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
.lesson { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 20px; overflow-wrap: anywhere; }
.lesson h2 { margin-top: 0; font-size: 21px; }
.lesson code { font-family: var(--mono); background: var(--code); padding: 1px 6px; border-radius: 4px; font-size: 0.9em; }
.lesson .code-block { background: var(--code); padding: 12px 14px; border-radius: 6px; font: 13px/1.5 var(--mono); white-space: pre-wrap; overflow-x: auto; }
.lesson table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 14px; display: block; overflow-x: auto; }
.lesson th, .lesson td { border: 1px solid var(--line); padding: 10px 14px; text-align: start; vertical-align: top; }
.lesson th { background: var(--code); }
.lesson td.tcp { color: var(--accent); font-weight: 600; }
.lesson td.udp { color: var(--ok); font-weight: 600; }
.lesson td.both { color: var(--tried); font-weight: 600; }
.lesson .muted-small { color: var(--muted); font-size: 12px; }
.info-box, .warn-box { padding: 12px 14px; border-radius: 6px; margin: 12px 0; border-left: 4px solid var(--ok); background: var(--ok-bg); }
.warn-box { border-left-color: var(--no); background: var(--no-bg); }

.quiz { margin-top: 18px; }
.q { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); padding: 12px 16px 14px; margin: 0 0 10px; }
.q legend { padding: 0 6px; font-weight: 600; }
.opts { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.opt { text-align: start; font: inherit; color: inherit; padding: 10px 14px; min-height: 44px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.sel { background: var(--sel); border-color: var(--accent); }
.opt.right { background: var(--ok-bg); border-color: var(--ok); }
.opt.wrong { background: var(--no-bg); border-color: var(--no); }
.opt:disabled { cursor: default; opacity: 0.75; }
.opt.num { font-family: var(--mono); }
.verdict { margin: 8px 0 0; font-size: 14px; }
.verdict.ok { color: var(--ok); }
.verdict.no { color: var(--no); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
.btn { font: inherit; padding: 10px 16px; min-height: 44px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.result { font-weight: 600; }
.result.ok { color: var(--ok); }
.result.no { color: var(--no); }
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; flex-wrap: wrap; }

.situation { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.turn { padding: 10px 14px; border-radius: 6px; margin: 8px 0; border-left: 4px solid var(--ok); background: var(--ok-bg); }
.turn.no { border-left-color: var(--no); background: var(--no-bg); }
.turn p { margin: 4px 0; }
.turn .pick { font-weight: 600; }
.reveal { background: var(--panel); border: 1px solid var(--ok); border-radius: var(--radius); padding: 14px 18px; margin-top: 12px; }
.reveal h2 { margin-top: 0; }
.lesson-line { font-weight: 600; }

#gq { width: 100%; max-width: 480px; font: inherit; padding: 8px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); margin: 6px 0 8px; }
.glossary { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.gl { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; }
.gl summary { cursor: pointer; font-weight: 600; }
details summary { cursor: pointer; }
.scen details { margin-top: 6px; }

.ports { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
.team { border-collapse: collapse; font-size: 14px; white-space: nowrap; }
.team th, .team td { padding: 10px 14px; border-bottom: 1px solid var(--line); text-align: start; }
.team thead th { padding-bottom: 8px; color: var(--muted); font-weight: 600; }
.team th:first-child, .team td:first-child { padding-inline-start: 16px; }
.team .cell { text-align: center; font: 12px var(--mono); padding: 10px 8px; }
.team .cell.done { background: var(--ok-bg); color: var(--ok); }
.team .cell.tried { color: var(--tried); }

.statusbar { position: sticky; bottom: 0; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; padding: 8px 16px; background: var(--panel); border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.statusbar .who { margin-inline-start: auto; }
.statusbar .link { color: var(--accent); }
.meter { width: 120px; height: 8px; background: var(--code); border-radius: 999px; overflow: hidden; }
.meter-fill { display: block; height: 100%; width: 0; background: var(--accent); }
.toast { position: fixed; inset-inline: 16px; bottom: 56px; margin: 0 auto; max-width: 420px; padding: 10px 14px; border-radius: 6px; background: var(--ink); color: var(--bg); text-align: center; }

@media (max-width: 600px) {
  main { padding: 14px 12px 28px; }
  .grid { grid-template-columns: 1fr; }
  .tabs { padding: 4px 6px 0; gap: 0; }
  .tabs a { padding: 10px 12px; }
  .tabs > a.wide-only { display: none; }
  .tabs .more { display: block; margin-inline-start: auto; }
  .statusbar .who { margin-inline-start: 0; width: 100%; }
}
</style>

</head>
<body>
<div id="app">
  <header class="titlebar">
    <span class="logo" aria-hidden="true">D</span>
    <span class="titles"><b id="title">Dojo</b><span id="tagline" class="tagline"></span></span>
  </header>
  <nav id="tabs" class="tabs" role="tablist" aria-label="Sections"></nav>
  <main id="main"><p class="empty">Loading</p></main>
  <footer id="bar" class="statusbar" aria-label="Progress"></footer>
  <div id="toast" class="toast" role="status" hidden></div>
</div>
<script>window.DOJO_COURSE = {"id": "print-networking", "title": "Print Networking Dojo", "tagline": "Networking for print and IT field engineers", "version": "5.0.0", "xp_per_level": 100, "ports_xp": 20, "modules": [{"id": "m01", "title": "IP Addressing & Subnets", "level": "beginner", "xp": 15, "summary": "Learn IPv4, subnet masks, gateways, the foundation of all network communication.", "lesson": "<h2>IP Addressing & Subnets<\/h2>\n<p>An IP address is a number that identifies a device on a network. Without it, no other device can find it. Every device on a TCP/IP network, your laptop, a printer, the uniFLOW server, has at least one.<\/p>\n\n<h3>IPv4 vs IPv6<\/h3>\n<p><b>IPv4<\/b> (<code>192.168.3.10<\/code>): four numbers 0-255 each. What you'll see 99% of the time.<\/p>\n<p><b>IPv6<\/b> (<code>2001:db8::1<\/code>): longer, hexadecimal. Growing but still minority in enterprise printing.<\/p>\n\n<h3>Subnets<\/h3>\n<p>A <b>subnet mask<\/b> defines which IPs are \"local\" (same network) vs \"remote\" (different network).<\/p>\n<p><code>192.168.3.10<\/code> with <code>255.255.255.0<\/code> (<code>/24<\/code>):<\/p>\n<ul>\n <li><code>192.168.3.0<\/code> to <code>192.168.3.255<\/code> = local (254 usable)<\/li>\n <li>Everything else = remote, must go through the <b>gateway<\/b><\/li>\n<\/ul>\n\n<h3>Gateway<\/h3>\n<p>The router that connects your local network to other networks. Usually <code>192.168.3.1<\/code> or <code>192.168.1.1<\/code>.<\/p>\n\n<div class=\"info-box\">\n<strong> uniFLOW connection:<\/strong> When a customer says \"printers are on VLAN 10 and the server on VLAN 20,\" traffic must pass through a router/firewall. If the firewall isn't configured for the right ports, nothing works.\n<\/div>\n\n<h3>Static vs DHCP<\/h3>\n<ul>\n <li><b>Servers MUST have static IPs.<\/b> If the uniFLOW server's IP changes, everything breaks.<\/li>\n <li><b>Printers SHOULD have static IPs.<\/b> If a printer's IP changes, uniFLOW can't find it.<\/li>\n <li><b>Workstations can use DHCP.<\/b> Their IP doesn't matter to anyone else.<\/li>\n<\/ul>\n\n<div class=\"warn-box\">\n<strong> Common pitfall:<\/strong> DHCP lease expires over a weekend → printer gets a new IP → Monday morning, nothing prints. Solution: DHCP reservations or static IPs.\n<\/div>\n\n<h3>Check your own setup<\/h3>\n<p><code>ip route show default<\/code>, shows your gateway.<\/p>\n<p><code>ip addr show<\/code>, shows your IP and subnet.<\/p>\n", "quiz": [{"q": "What does a subnet mask of /24 (255.255.255.0) mean?", "options": ["254 usable addresses", "16,384 usable addresses", "65,534 usable addresses", "2 usable addresses"], "answer": 0, "explain": ""}, {"q": "What is a gateway?", "options": ["A firewall rule", "A router connecting networks", "A DNS server", "A printer queue"], "answer": 1, "explain": ""}, {"q": "What is the private IP range for Class A?", "options": ["192.168.0.0/16", "172.16.0.0/12", "10.0.0.0/8", "169.254.0.0/16"], "answer": 2, "explain": ""}]}, {"id": "m02", "title": "Ports: The Doors", "level": "beginner", "xp": 20, "summary": "Understand ports 0-65535, the apartment doors of networking. This is the #1 concept for uniFLOW deployments.", "lesson": "<h2>Ports: The Doors<\/h2>\n<p>An IP address tells you <i>which machine<\/i>. A port tells you <i>which service<\/i> on that machine.<\/p>\n<p>Think of the machine as an apartment building. The IP is the street address. Ports are individual apartment doors, numbered 0-65535.<\/p>\n\n<h3>Port ranges<\/h3>\n<table class=\"port-table\">\n<tr><th>Range<\/th><th>Name<\/th><th>Examples<\/th><\/tr>\n<tr><td>0-1023<\/td><td>Well-known<\/td><td>80 (HTTP), 443 (HTTPS), 25 (SMTP)<\/td><\/tr>\n<tr><td>1024-49151<\/td><td>Registered<\/td><td>1433 (SQL), 9100 (printing), 8080 (proxy)<\/td><\/tr>\n<tr><td>49152-65535<\/td><td>Ephemeral<\/td><td>Temporary ports for outbound connections<\/td><\/tr>\n<\/table>\n\n<h3>The Four-Number Connection<\/h3>\n<p>Every connection is defined by FOUR numbers:<\/p>\n<pre class=\"code-block\">\nSource IP : Source Port → Destination IP : Destination Port\n192.168.3.10 : 52341 → 192.168.3.50 : 443\n<\/pre>\n\n<div class=\"info-box\">\n<strong>Key insight:<\/strong> Your computer picks a random ephemeral port (52341) for its side. The destination port is the well-known port for the service. This is why you can open 20 browser tabs to the same website, each gets a different source port.\n<\/div>\n\n<h3>uniFLOW-relevant ports at a glance<\/h3>\n<table class=\"port-table\">\n<tr><th>Port<\/th><th>Protocol<\/th><th>Service<\/th><\/tr>\n<tr><td>80/443<\/td><td class=\"both\">TCP<\/td><td>HTTP/HTTPS, web UI, API, MEAP app communication<\/td><\/tr>\n<tr><td>161<\/td><td class=\"udp\">UDP<\/td><td>SNMP, device discovery, counter reading<\/td><\/tr>\n<tr><td>445<\/td><td class=\"tcp\">TCP<\/td><td>SMB, scan-to-folder, file sharing<\/td><\/tr>\n<tr><td>9100<\/td><td class=\"tcp\">TCP<\/td><td>RAW printing, direct job submission<\/td><\/tr>\n<tr><td>47545<\/td><td class=\"udp\">UDP<\/td><td>CPCA, Canon device status and counter data<\/td><\/tr>\n<\/table>\n", "quiz": [{"q": "What does the notation 192.168.3.10:443 mean?", "options": ["IP address : MAC address", "IP address : Port number", "Hostname : Domain", "Network : Subnet"], "answer": 1, "explain": ""}, {"q": "Which port range contains 9100 (RAW printing)?", "options": ["Well-known (0-1023)", "Registered (1024-49151)", "Ephemeral (49152-65535)", "Reserved (60000+)"], "answer": 1, "explain": ""}, {"q": "How many numbers define a single network connection?", "options": ["2", "3", "4", "1"], "answer": 2, "explain": "Source IP : Source Port → Destination IP : Destination Port"}]}, {"id": "m03", "title": "TCP vs UDP", "level": "beginner", "xp": 15, "summary": "Phone calls vs postcards, reliable printing data vs fast device discovery. Know when to use each.", "lesson": "<h2>TCP vs UDP<\/h2>\n<p>Two ways to send data across a network. This choice directly affects how uniFLOW components communicate.<\/p>\n\n<h3>TCP, Transmission Control Protocol<\/h3>\n<ul>\n <li><b>Like a phone call<\/b>, dial, connect, talk, hang up<\/li>\n <li>Connection-oriented: 3-way handshake (SYN → SYN-ACK → ACK)<\/li>\n <li><b>Guaranteed delivery:<\/b> lost packets are re-sent<\/li>\n <li><b>Ordered:<\/b> packets arrive in order sent<\/li>\n <li>Used for: print jobs, web browsing, email, databases, SMTP<\/li>\n<\/ul>\n\n<h3>UDP, User Datagram Protocol<\/h3>\n<ul>\n <li><b>Like a postcard<\/b>, write, send, hope it arrives<\/li>\n <li>Connectionless: no handshake, just fire and forget<\/li>\n <li><b>No delivery guarantee:<\/b> lost packets are gone<\/li>\n <li><b>No ordering:<\/b> packets may arrive out of order<\/li>\n <li>Used for: DNS, SNMP, CPCA status notifications, device discovery<\/li>\n<\/ul>\n\n<div class=\"info-box\">\n<strong>Official uniFLOW glossary definition:<\/strong> \"UDP is used for simple transmission purposes where error checking and/or correction during the transport is not necessary. Thus, UDP is used together with the IP, however on the network level without the TCP.\" <span class=\"muted-small\">, uniFLOW 2026.1 Manual, Glossary<\/span>\n<\/div>\n\n<h3>Why this matters on-site<\/h3>\n<ul>\n <li>uniFLOW print jobs use <b>TCP<\/b> (must guarantee the document arrives intact)<\/li>\n <li>Printer discovery uses <b>UDP<\/b> (SNMP broadcasts)<\/li>\n <li>If a firewall blocks UDP port 161, uniFLOW can't discover printers for counter reading<\/li>\n<\/ul>\n", "quiz": [{"q": "Why does uniFLOW use TCP for print jobs?", "options": ["It's faster", "It guarantees delivery and ordering", "It uses less bandwidth", "Firewalls prefer TCP"], "answer": 1, "explain": ""}, {"q": "What protocol does SNMP use and why?", "options": ["TCP, for reliability", "TCP, for encryption", "UDP, for speed and low overhead", "ICMP, for device discovery"], "answer": 2, "explain": ""}]}, {"id": "m04", "title": "SSL/TLS & Certificates", "level": "intermediate", "xp": 20, "summary": "Official uniFLOW: TLS 1.2 minimum, images on devices use TLS 1.3. Certificate chain troubleshooting.", "lesson": "<h2>SSL/TLS & Certificates<\/h2>\n<p>Encryption protocol that secures data between two parties. Nobody in the middle can read it.<\/p>\n\n<h3>TLS Versions<\/h3>\n<ul>\n <li><b>TLS 1.0/1.1<\/b>, Deprecated, insecure. Do not use.<\/li>\n <li><b>TLS 1.2<\/b>, Minimum for uniFLOW Online (256-bit AES)<\/li>\n <li><b>TLS 1.3<\/b>, Newest, fastest. Used by imageRUNNER/imageFORCE devices<\/li>\n<\/ul>\n\n<h3>Official Glossary Definition<\/h3>\n<div class=\"info-box\">\n<strong>TLS (Transport Layer Security), SSL (Secure Sockets Layer):<\/strong> \"Cryptographic protocols that provide secure communications over the Internet. Today, TLS is mostly used with HTTPS. Known implementations of the protocol are OpenSSL and GnuTLS.\" <span class=\"muted-small\">, uniFLOW 2026.1 Manual, Glossary<\/span>\n<\/div>\n\n<h3>How it connects to your work<\/h3>\n<ul>\n <li><b>uniFLOW Online:<\/b> ALL connections use HTTPS (TLS 1.2 minimum). OAuth 2.0 for authentication.<\/li>\n <li><b>uniFLOW On-Prem:<\/b> SMTP with TLS on port 587. SMS web interface ALWAYS uses TLS encryption.<\/li>\n <li><b>IWEMC:<\/b> TLS 1.3 recommended for device communication.<\/li>\n <li><b>E-Maintenance:<\/b> Encryption for data in transit between device and Canon cloud.<\/li>\n<\/ul>\n\n<div class=\"warn-box\">\n<strong> Certificate problem:<\/strong> If a device's certificate is expired or self-signed, connections fail with \"certificate error.\" This is why some deployments use HTTP (port 80) internally, simpler but insecure.\n<\/div>\n", "quiz": [{"q": "What is the minimum TLS version for uniFLOW Online?", "options": ["TLS 1.0", "TLS 1.1", "TLS 1.2", "Any version is fine"], "answer": 2, "explain": ""}, {"q": "What happens when a device's SSL certificate is expired?", "options": ["Nothing, it still works", "Connections fail with certificate errors", "TLS falls back to 1.0", "The device auto-renews it"], "answer": 1, "explain": ""}]}, {"id": "m05", "title": "RAW 9100 & LPR", "level": "intermediate", "xp": 20, "summary": "Direct print protocols. How uniFLOW sends jobs to printers via TCP port 9100 and LPD port 515.", "lesson": "<h2>RAW 9100 & LPR<\/h2>\n<p>Direct print protocols. The \"low-level\" ways to send documents to a printer.<\/p>\n\n<h3>RAW Port 9100 (JetDirect / AppSocket)<\/h3>\n<table class=\"port-table\">\n<tr><th>Property<\/th><th>Value<\/th><\/tr>\n<tr><td>Port<\/td><td><b>9100<\/b> (TCP)<\/td><\/tr>\n<tr><td>Protocol<\/td><td class=\"tcp\">TCP<\/td><\/tr>\n<tr><td>Purpose<\/td><td>Direct print job submission<\/td><\/tr>\n<\/table>\n<p>The simplest printing protocol. Client opens a TCP connection to port 9100 and sends raw print data (PCL, PostScript, or PDF). No metadata, no job tracking, just \"here's data, print it.\"<\/p>\n\n<h3>LPR/LPD (Line Printer Daemon)<\/h3>\n<table class=\"port-table\">\n<tr><th>Property<\/th><th>Value<\/th><\/tr>\n<tr><td>Port<\/td><td><b>515<\/b> (TCP)<\/td><\/tr>\n<tr><td>Protocol<\/td><td class=\"tcp\">TCP<\/td><\/tr>\n<tr><td>Purpose<\/td><td>Legacy print job submission<\/td><\/tr>\n<\/table>\n<p>Oldest printing protocol. Still supported by virtually all network printers. uniFLOW supports LPR as an alternative to RAW 9100.<\/p>\n\n<div class=\"warn-box\">\n<strong> Security:<\/strong> Port 9100 has NO authentication and NO encryption. Anyone who can reach port 9100 on a printer can send print jobs. This is why pull-printing (Secure Print) was invented.\n<\/div>\n\n<h3>uniFLOW Deployment Context<\/h3>\n<ul>\n <li>uniFLOW On-Prem Step 5: When adding the output printer as \"TCP/IP,\" port 9100 is the default.<\/li>\n <li>uniFLOW Online: Jobs are released at the MFD via HTTPS (not 9100), then printed internally.<\/li>\n <li>LPR on port 515 is an alternative for legacy systems.<\/li>\n<\/ul>\n", "quiz": [{"q": "What is the security problem with RAW port 9100?", "options": ["It's slow", "No authentication or encryption", "It only works with Canon devices", "It uses UDP"], "answer": 1, "explain": ""}, {"q": "In uniFLOW On-Prem Step 5, what port is default for TCP/IP output printers?", "options": ["515", "631", "9100", "445"], "answer": 2, "explain": ""}]}, {"id": "m06", "title": "SNMP & CPCA", "level": "intermediate", "xp": 25, "summary": "How uniFLOW discovers and monitors devices. SNMP port 161/UDP for basics, CPCA ports 47545+ for deep data.", "lesson": "<h2>SNMP & CPCA<\/h2>\n<p>Two protocols for talking to devices, one universal (SNMP), one Canon-specific (CPCA).<\/p>\n\n<h3>SNMP, Simple Network Management Protocol<\/h3>\n<table class=\"port-table\">\n<tr><th>Property<\/th><th>Value<\/th><\/tr>\n<tr><td>Port<\/td><td class=\"udp\">161 (UDP) queries, 162 (UDP) traps<\/td><\/tr>\n<tr><td>Protocol<\/td><td class=\"udp\">UDP<\/td><\/tr>\n<tr><td>Purpose<\/td><td>Device discovery, status monitoring, toner levels, page counters<\/td><\/tr>\n<\/table>\n\n<p>The <b>community string<\/b> is SNMP's password. Default: <code>public<\/code> (read) or <code>private<\/code> (write). Customers often change these, you MUST get the community name from them.<\/p>\n\n<div class=\"info-box\">\n<strong>Official glossary definition:<\/strong> \"SNMP consists of a set of standards for network management, including an application layer protocol, a database scheme, and a set of data objects. SNMP works by sending PDUs to different parts of a network. SNMP-compliant devices, called agents, store data about themselves in Management Information Bases (MIBs) and return this data to SNMP requesters.\" <span class=\"muted-small\">, uniFLOW 2026.1 Manual, Glossary<\/span>\n<\/div>\n\n<h3>CPCA, Canon Peripheral Connection Architecture<\/h3>\n<table class=\"port-table\">\n<tr><th>Port<\/th><th>Protocol<\/th><th>Direction<\/th><th>Function<\/th><\/tr>\n<tr><td class=\"udp\">47545<\/td><td>UDP<\/td><td>Device↔Server<\/td><td>Status, counters, wake-from-sleep<\/td><\/tr>\n<tr><td class=\"tcp\">47546<\/td><td>TCP<\/td><td>Server→Device<\/td><td>Alarm/jam/service logs<\/td><\/tr>\n<tr><td class=\"tcp\">9007<\/td><td>TCP<\/td><td>Server→Device<\/td><td>Log information retrieval<\/td><\/tr>\n<tr><td class=\"tcp\">9013<\/td><td>TCP<\/td><td>Server→Device<\/td><td>MF-series device info<\/td><\/tr>\n<tr><td class=\"udp\">11427<\/td><td>UDP<\/td><td>Device→Server<\/td><td>Power state notification<\/td><\/tr>\n<\/table>\n\n<div class=\"info-box\">\n<strong>Official glossary definition:<\/strong> \"CPCA (Canon Peripheral Connection Architecture) is Canon's proprietary protocol for communicating with their devices. It retrieves detailed counter information (service mode counters, department counters, part counters), firmware information, real-time status change notifications, alarm/service call/jam logs, and can wake devices from sleep mode.\" <span class=\"muted-small\">, uniFLOW 2026.1 Manual, Glossary<\/span>\n<\/div>\n\n<h3>Which one to use?<\/h3>\n<ul>\n <li><b>SNMP<\/b>, Good for basic device discovery and counter reading across all vendors<\/li>\n <li><b>CPCA<\/b>, Richer data, Canon-specific. Used by Canon Data Collection Agent, IWEMC, E-Maintenance<\/li>\n <li>If CPCA ports are blocked, you still get basic SNMP data but lose detailed counters and real-time alerts<\/li>\n<\/ul>\n", "quiz": [{"q": "What port does CPCA primarily use?", "options": ["UDP 161", "UDP 47545", "TCP 443", "TCP 9100"], "answer": 1, "explain": ""}, {"q": "What is the SNMP community string?", "options": ["The device model number", "The SNMP password", "The MIB identifier", "The port number"], "answer": 1, "explain": ""}]}, {"id": "m07", "title": "SMB & Scan-to-Folder", "level": "intermediate", "xp": 15, "summary": "SMB port 445 for Windows file sharing. Scan-to-folder failures, the SMB version mismatch problem.", "lesson": "<h2>SMB & Scan-to-Folder<\/h2>\n\n<h3>SMB/CIFS, Windows File Sharing<\/h3>\n<table class=\"port-table\">\n<tr><th>Port<\/th><th>Protocol<\/th><th>Purpose<\/th><\/tr>\n<tr><td class=\"tcp\">445<\/td><td>TCP<\/td><td>Direct SMB (modern)<\/td><\/tr>\n<tr><td class=\"tcp\">139<\/td><td>TCP<\/td><td>NetBIOS session (legacy)<\/td><\/tr>\n<\/table>\n\n<div class=\"info-box\">\n<strong>Official glossary definition:<\/strong> \"SMB operates as an application-level network protocol mainly applied to shared access to files, printers, serial ports, and miscellaneous communications between nodes on a network. It also provides an authenticated Inter-process communication mechanism.\" <span class=\"muted-small\">, uniFLOW 2026.1 Manual, Glossary<\/span>\n<\/div>\n\n<h3>Scan-to-Folder<\/h3>\n<p>When a user scans a document and it saves to <code>\\\\fileserver\\scans<\/code>, that's SMB on port 445. Port 445 must be open between the MFD and the file server.<\/p>\n\n<div class=\"warn-box\">\n<strong> #1 Scan-to-Folder Failure:<\/strong> SMB version mismatch. Windows Server 2022 requires SMB 3.0 with encryption. Older MFPs may only support SMB 1.0 (disabled by default on modern Windows for security). This causes scan-to-folder to fail silently, the MFD says \"Complete\" but the file never arrives.\n<\/div>\n\n<h3>Quick Troubleshooting<\/h3>\n<ol>\n <li>Confirm the MFD can reach the file server (ping test)<\/li>\n <li>Check SMB version support on both sides<\/li>\n <li>Verify firewall allows outbound TCP 445 from MFD VLAN to file server<\/li>\n <li>Test with a different share path (avoid long UNC paths)<\/li>\n <li>Check the file server's event log for SMB session failures<\/li>\n<\/ol>\n", "quiz": [{"q": "What port does direct SMB use?", "options": ["139", "445", "445 and 139 both", "80"], "answer": 1, "explain": ""}, {"q": "Why do older MFPs fail to scan to a modern Windows share?", "options": ["UDP is blocked", "SMB version mismatch (SMB 1.0 disabled)", "Wrong IP address", "DNS resolution failure"], "answer": 1, "explain": ""}]}, {"id": "m08", "title": "Firewalls, VLANs & Proxies", "level": "advanced", "xp": 30, "summary": "The #1 deployment blocker. Firewall rules, VLAN segmentation, and proxy bypass for uniFLOW cloud URLs.", "lesson": "<h2>Firewalls, VLANs & Proxies<\/h2>\n<p>The <b>#1 deployment blocker<\/b> for uniFLOW. Every data path must be allowed through every firewall along the way.<\/p>\n\n<h3>Firewall Rules<\/h3>\n<p>A firewall rule says: <code>Allow traffic FROM 192.168.3.0/24 TO 192.168.10.50 ON port 443<\/code>. Everything not explicitly allowed is <b>denied<\/b>.<\/p>\n\n<h3>Common uniFLOW Firewall Ports<\/h3>\n<table class=\"port-table\">\n<tr><th>Direction<\/th><th>Port<\/th><th>Protocol<\/th><th>Why<\/th><\/tr>\n<tr><td>MFD → uniFLOW Server<\/td><td class=\"both\">443<\/td><td>TCP<\/td><td>Authentication, job release<\/td><\/tr>\n<tr><td>MFD → uniFLOW Server<\/td><td class=\"udp\">47545<\/td><td>UDP<\/td><td>CPCA status/events<\/td><\/tr>\n<tr><td>uniFLOW Server → MFD<\/td><td class=\"udp\">161<\/td><td>UDP<\/td><td>SNMP counter reading<\/td><\/tr>\n<tr><td>uniFLOW Server → MFD<\/td><td class=\"tcp\">9100<\/td><td>TCP<\/td><td>RAW print job submission<\/td><\/tr>\n<tr><td>MFD → File Server<\/td><td class=\"tcp\">445<\/td><td>TCP<\/td><td>Scan-to-folder (SMB)<\/td><\/tr>\n<tr><td>uniFLOW Server → SQL<\/td><td class=\"tcp\">1433<\/td><td>TCP<\/td><td>Database connection<\/td><\/tr>\n<tr><td>uniFLOW Server → SMTP<\/td><td class=\"tcp\">587<\/td><td>TCP<\/td><td>Email notifications<\/td><\/tr>\n<\/table>\n\n<h3>VLANs, Virtual Walls<\/h3>\n<p>Splits one physical network into multiple logical networks. Devices on different VLANs can't talk unless a router/firewall explicitly allows it.<\/p>\n<ul>\n <li>VLAN 10: Printers (<code>192.168.10.0/24<\/code>)<\/li>\n <li>VLAN 20: Servers (<code>192.168.20.0/24<\/code>)<\/li>\n<\/ul>\n<p>If printers are on VLAN 10 and the uniFLOW server is on VLAN 20, traffic must cross through the firewall. First question on \"can't see printers\": <b>Are they on the same VLAN?<\/b><\/p>\n\n<h3>Proxies<\/h3>\n<p>Many enterprises route ALL traffic through a proxy. But MFDs often <b>bypass the proxy<\/b>, or need an explicit exception.<\/p>\n<p><b>URLs needing proxy bypass:<\/b><\/p>\n<ul>\n <li><code>*.nt-ware.com<\/code><\/li>\n <li><code>*.uniflowonline.com<\/code><\/li>\n <li><code>device.c-cdsknn.net<\/code> / <code>device02.c-cdsknn.net<\/code><\/li>\n <li><code>download.nt-ware.net<\/code><\/li>\n<\/ul>\n", "quiz": [{"q": "Why is VLAN segmentation a common uniFLOW deployment problem?", "options": ["VLANs don't support TCP", "Firewall rules between VLANs block needed ports", "VLANs use different IP versions", "printers can't use VLANs"], "answer": 1, "explain": ""}, {"q": "Which uniFLOW Online domains need proxy bypass?", "options": ["*.google.com", "*.nt-ware.com and *.uniflowonline.com", "*.microsoft.com", "*.canon.com"], "answer": 1, "explain": ""}]}, {"id": "m09", "title": "DNS, DHCP & NAT", "level": "advanced", "xp": 25, "summary": "DNS resolution failures = everything broken. DHCP leases can cause printer IP changes. NAT and uniFLOW Online's outbound-only design.", "lesson": "<h2>DNS, DHCP & NAT<\/h2>\n\n<h3>DNS, The Phonebook<\/h3>\n<p>Translates names to IPs. <code>uniflow.customer.com<\/code> → DNS → <code>192.168.3.10<\/code><\/p>\n<div class=\"info-box\">\n<strong>Official uniFLOW guideline:<\/strong> The uniFLOW Release Station requires Primary DNS and Secondary DNS configuration (firmware V1.5 or newer required).\n<\/div>\n<p><b>If DNS is broken, nothing works<\/b>, not even if the network is perfectly fine. This is why some admins hardcode IPs (bypasses DNS failures).<\/p>\n\n<h3>DHCP, Dynamic Host Configuration Protocol<\/h3>\n<p>Device boots up, broadcasts \"I need an IP!\" DHCP server responds \"Use 192.168.3.50 for 24 hours.\"<\/p>\n<ul>\n <li><b>Servers:<\/b> Static IP mandatory<\/li>\n <li><b>Printers:<\/b> Static IP strongly recommended. DHCP lease expiry → IP change → uniFLOW loses the printer<\/li>\n <li><b>Workstations:<\/b> DHCP is fine<\/li>\n<\/ul>\n\n<h3>NAT, Network Address Translation<\/h3>\n<p>Converts private IPs to public IPs. <code>192.168.3.10 → Router: 203.0.113.5 → Internet<\/code><\/p>\n<ul>\n <li><b>uniFLOW Online:<\/b> Designed to work through NAT, MFD connects OUT, no inbound ports needed<\/li>\n <li><b>uniFLOW On-Prem:<\/b> Everything is local, NAT doesn't apply<\/li>\n <li><b>Remote access:<\/b> Need port forwarding (inbound NAT rule for 443)<\/li>\n<\/ul>\n", "quiz": [{"q": "Why does a printer IP change break uniFLOW?", "options": ["uniFLOW uses MAC addresses", "Printers must have static IPs in uniFLOW", "DNS caches the old IP", "The printer needs a reboot"], "answer": 1, "explain": ""}, {"q": "Why does NAT work for uniFLOW Online without special config?", "options": ["uniFLOW uses IPv6", "The MFD connects OUT to the cloud (outbound works through NAT)", "NAT preserves port numbers", "Canon devices have built-in NAT"], "answer": 1, "explain": ""}]}, {"id": "m10", "title": "Device Agents & Deployment", "level": "expert", "xp": 35, "summary": "Official glossary terms: Device Agent types, CPCA Spooler Control, Counter Readers, Hotfolder Monitor, and all port requirements.", "lesson": "<h2>Device Agents & Deployment<\/h2>\n<p>Sourced directly from the <b>uniFLOW 2026.1 User Manual<\/b>. These are the official Device Agent types and their network requirements.<\/p>\n\n<h3>Device Agent Categories (Official)<\/h3>\n<table class=\"port-table\">\n<tr><th>Category<\/th><th>Agent Type<\/th><th>Network Ports<\/th><\/tr>\n<tr><td>Spooler Control<\/td><td>CPCA Spooler Control<\/td><td class=\"udp\">UDP 47545<\/td><\/tr>\n<tr><td>Counter Reading<\/td><td>Canon RUI Counter Reader<\/td><td class=\"both\">HTTPS (port 443)<\/td><\/tr>\n<tr><td>Counter Reading<\/td><td>HP LaserJet Counter Reader<\/td><td class=\"both\">HTTP/HTTPS<\/td><\/tr>\n<tr><td>Counter Reading<\/td><td>SNMP Counter Reader<\/td><td class=\"udp\">UDP 161<\/td><\/tr>\n<tr><td>Counter Reading<\/td><td>SiteAudit Counter Reader<\/td><td class=\"udp\">UDP 161<\/td><\/tr>\n<tr><td>Log Reading<\/td><td>CPCA Log Reader<\/td><td class=\"udp\">UDP 47545<\/td><\/tr>\n<tr><td>Log Reading<\/td><td>Canon RUI Copy Log Reader<\/td><td class=\"both\">HTTPS (port 443)<\/td><\/tr>\n<tr><td>Synchronization<\/td><td>CPCA Dept ID Synchronizer<\/td><td class=\"udp\">UDP 47545<\/td><\/tr>\n<tr><td>Other<\/td><td>Hotfolder Monitor<\/td><td>Local file system<\/td><\/tr>\n<\/table>\n\n<h3>CPCA Spooler Control<\/h3>\n<div class=\"info-box\">\n<strong>From the official manual:<\/strong> \"This Device Agent is used to exercise control over the built-in spooler of a Canon MFP via CPCA. Its functionality includes stopping, pausing, and aborting print jobs that are already spooled to the Canon MFP. CPCA requires UDP port 47545. Since the built-in spooler of a Canon MFP is a network feature, it is not possible to control local print jobs (e.g., from a USB stick) via this Device Agent.\"\n<\/div>\n\n<h3>Ping Check, All Device Agents<\/h3>\n<p>Every Device Agent that contacts a device over HTTP/HTTPS has a <b>Ping Check<\/b> option:<\/p>\n<ul>\n <li><b>Yes (default):<\/b> \"Before establishing contact via HTML, the Device Agent will check whether the device is online with an ICMP ping.\"<\/li>\n <li><b>No:<\/b> Bypasses ping check.<\/li>\n<\/ul>\n\n<h3>Hotfolder Monitor<\/h3>\n<div class=\"warn-box\">\n<strong>Important constraint:<\/strong> \"The uniFLOW server executes in the Local Service account. Thus, it cannot access any network shares for monitoring. If you do require to monitor network shares, please change the account that the uniFLOW Server service is configured to run in.\"\n<\/div>\n\n<h3>Key Port Summary, All-in-One<\/h3>\n<table class=\"port-table\">\n<tr><th>Port<\/th><th>Transport<\/th><th>Used By<\/th><\/tr>\n<tr><td>80<\/td><td class=\"tcp\">TCP<\/td><td>HTTP (some internal RUI access)<\/td><\/tr>\n<tr><td>443<\/td><td class=\"tcp\">TCP<\/td><td>HTTPS (web UI, MEAP apps, Smart Client, uniFLOW Online)<\/td><\/tr>\n<tr><td>161<\/td><td class=\"udp\">UDP<\/td><td>SNMP (device discovery, counter reading)<\/td><\/tr>\n<tr><td>445<\/td><td class=\"tcp\">TCP<\/td><td>SMB (scan-to-folder)<\/td><\/tr>\n<tr><td>515<\/td><td class=\"tcp\">TCP<\/td><td>LPR (legacy printing)<\/td><\/tr>\n<tr><td>587<\/td><td class=\"tcp\">TCP<\/td><td>SMTP with TLS (email)<\/td><\/tr>\n<tr><td>631<\/td><td class=\"tcp\">TCP<\/td><td>IPP (Internet Printing Protocol)<\/td><\/tr>\n<tr><td>1433<\/td><td class=\"tcp\">TCP<\/td><td>SQL Server database<\/td><\/tr>\n<tr><td>9100<\/td><td class=\"tcp\">TCP<\/td><td>RAW printing<\/td><\/tr>\n<tr><td>47545<\/td><td class=\"udp\">UDP<\/td><td>CPCA events, counter retrieval, wake<\/td><\/tr>\n<tr><td>47546<\/td><td class=\"tcp\">TCP<\/td><td>CPCA alarm/jam/service logs<\/td><\/tr>\n<\/table>\n", "quiz": [{"q": "What does the CPCA Spooler Control Device Agent do?", "options": ["Reads printer counters", "Controls the built-in spooler of Canon MFPs via CPCA", "Discovers printers on the network", "Manages print driver updates"], "answer": 1, "explain": ""}, {"q": "What is the Hotfolder Monitor used for?", "options": ["Printing from a USB drive", "Monitoring a folder for incoming print files", "Tracking scan jobs", "Managing print queues"], "answer": 1, "explain": ""}, {"q": "What ping method do Device Agents use before contacting a device?", "options": ["TCP ping on port 80", "ICMP ping", "ARP broadcast", "UDP ping on port 161"], "answer": 1, "explain": "From the official manual: \"Before establishing contact via HTML, the Device Agent will check whether the device is online with an ICMP ping.\""}]}, {"id": "m11", "title": "Printer Languages: PostScript, PCL & UFR II", "level": "intermediate", "xp": 25, "summary": "The language your print job speaks. Pick wrong = garbage output. PCL, PostScript, UFR II, what they are and when to use each.", "lesson": "<h2>Printer Languages: PostScript, PCL & UFR II<\/h2>\n<p><b>A printer language<\/b> (also called a Page Description Language or PDL) is the dialect your print job speaks. The driver translates your document into this language. The printer interprets it.<\/p>\n<p>Pick the wrong one → garbled output, missing elements, or blank pages.<\/p>\n\n<h3>PostScript (PS), The Heavy Lifter<\/h3>\n<ul>\n <li><b>Developed by Adobe<\/b>, a full programming language, not just a printer format<\/li>\n <li><b>Vector-based<\/b>, math describes shapes, so it scales perfectly<\/li>\n <li><b>Best for:<\/b> Prepress, high-end graphics, publishing, ERP/accounting apps that generate PostScript natively<\/li>\n <li><b>Downside:<\/b> Processing happens ON the printer (needs a RIP = Raster Image Processor). PostScript printers cost more.<\/li>\n <li><b>Port:<\/b> Sent via RAW 9100 or LPR 515 like any other PDL<\/li>\n<\/ul>\n\n<h3>PCL (Printer Command Language), The Business Standard<\/h3>\n<ul>\n <li><b>Developed by HP<\/b>, the industry standard for office printing<\/li>\n <li><b>PCL 5e:<\/b> Supports HP-GL/2 vector graphics. Good for general office docs.<\/li>\n <li><b>PCL 6 / PCL XL:<\/b> Object-oriented, faster for business graphics. <b>NOT backward compatible<\/b> with PCL 5.<\/li>\n <li><b>Canon Generic PCL 6 Driver<\/b>, Canon's implementation of PCL XL. Works across Canon model families.<\/li>\n <li><b>Best for:<\/b> Microsoft Office documents, general office printing, multi-vendor fleets<\/li>\n<\/ul>\n\n<h3>UFR II (Ultra Fast Rendering), Canon's Secret Weapon<\/h3>\n<ul>\n <li><b>Canon proprietary<\/b>, built into every Canon imageRUNNER and imageRUNNER ADVANCE<\/li>\n <li><b>Load balancing:<\/b> The PC does some rendering, the printer finishes it. Splits the work intelligently.<\/li>\n <li><b>Part of CAPT<\/b> (Canon Advanced Printing Technology), optimizes throughput<\/li>\n <li><b>Best for:<\/b> Canon-only fleets, any Canon MFP, it's the default and recommended driver<\/li>\n <li><b>Downside:<\/b> Only works on Canon devices. If a customer adds non-Canon printers... you need PCL or PS.<\/li>\n<\/ul>\n\n<h3>Picking the Right One On-Site<\/h3>\n<table class=\"port-table\">\n<tr><th>Situation<\/th><th>Use<\/th><\/tr>\n<tr><td>All Canon devices, standard office use<\/td><td class=\"tcp\"><b>UFR II<\/b> (default Canon driver)<\/td><\/tr>\n<tr><td>Mixed vendor fleet (Canon + HP + others)<\/td><td class=\"both\"><b>PCL 6<\/b> (universal compatibility)<\/td><\/tr>\n<tr><td>Accounting/ERP app generating PostScript<\/td><td class=\"both\"><b>PostScript<\/b><\/td><\/tr>\n<tr><td>Publishing, prepress, high-end graphics<\/td><td class=\"both\"><b>PostScript<\/b> (RIP on printer)<\/td><\/tr>\n<tr><td>Legacy app that crashes on UFR II<\/td><td class=\"both\"><b>PCL 6<\/b> (try first) or <b>PostScript<\/b><\/td><\/tr>\n<tr><td>macOS / Linux client printing to Canon<\/td><td class=\"tcp\"><b>PCL 6<\/b> or <b>PostScript<\/b> (UFR II driver not available for non-Windows)<\/td><\/tr>\n<\/table>\n\n<div class=\"warn-box\">\n<strong> Pro tip:<\/strong> You can have <b>multiple print queues<\/b> pointing to the same physical printer, each with a different driver. One queue with UFR II for general use, another with PostScript for the accounting department.\n<\/div>\n", "quiz": [{"q": "Which printer language is a full programming language, best for complex graphics and prepress?", "options": ["PCL 6", "PostScript", "UFR II", "PCL XL"], "answer": 1, "explain": ""}, {"q": "What is Canon's proprietary printer language?", "options": ["PostScript", "PCL 6", "UFR II (Ultra Fast Rendering)", "PCL XL"], "answer": 2, "explain": ""}, {"q": "When would you switch from a Canon UFR II driver to a PCL 6 driver?", "options": ["Never, Canon devices only use UFR II", "When the customer reports missing font support or compatibility issues", "When printing photos", "When printing from macOS"], "answer": 1, "explain": ""}, {"q": "What does PDL stand for?", "options": ["Printer Document Language", "Page Description Language", "Print Data Language", "PostScript Description Language"], "answer": 1, "explain": ""}, {"q": "Which language processes rendering on the PC side (load-balancing with the printer)?", "options": ["PostScript, all processing on printer", "PCL 6, all processing on printer", "UFR II, splits processing between PC and printer", "PCL 5, all processing on printer"], "answer": 2, "explain": ""}]}, {"id": "m12", "title": "Printer Drivers: V3 vs V4 & Canon Drivers", "level": "advanced", "xp": 30, "summary": "The software that translates your document into printer language. V3 vs V4, Canon Generic vs type-specific, Group Policy deployment.", "lesson": "<h2>Printer Drivers: V3 vs V4 & Canon Drivers<\/h2>\n<p>The driver is the translator between your document and the printer. In an enterprise deployment, driver selection is a <b>critical decision<\/b> that affects stability, performance, and support burden.<\/p>\n\n<h3>V3 vs V4 Windows Driver Model<\/h3>\n<table class=\"port-table\">\n<tr><th>Feature<\/th><th>V3 (Legacy)<\/th><th>V4 (Modern)<\/th><\/tr>\n<tr><td>Architecture<\/td><td>Kernel mode, can BSOD the OS<\/td><td>User mode, crash-safe<\/td><\/tr>\n<tr><td>Config UI<\/td><td>Vendor-provided UI (separate DLL)<\/td><td>JavaScript-based, Windows-native UI<\/td><\/tr>\n<tr><td>Driver Store<\/td><td>Manual install per driver<\/td><td>Package-based, easier deployment<\/td><\/tr>\n<tr><td>Feature parity<\/td><td>Full, all finishing options<\/td><td>Some advanced features may be missing<\/td><\/tr>\n<tr><td>Best for<\/td><td>Print servers, complex finishing<\/td><td>Client machines, modern Windows<\/td><\/tr>\n<\/table>\n\n<h3>Canon Driver Types<\/h3>\n<ul>\n <li><b>Canon Generic Printer Driver (UFR II / PCL 6 / PS):<\/b> One driver, multiple model families. Best for fleet standardization.<\/li>\n <li><b>Device-specific drivers:<\/b> Optimized for a single model. May expose unique finishing features (punch, booklet, inserter).<\/li>\n <li><b>Canon Driver Configuration Tool:<\/b> Pre-configure driver defaults (duplex, stapling, paper trays) before deployment.<\/li>\n<\/ul>\n\n<h3>Enterprise Deployment Methods<\/h3>\n<ol>\n <li><b>Group Policy (GPO):<\/b> <code>Computer Configuration → Administrative Templates → Printers<\/code>. Push printers + drivers via AD.<\/li>\n <li><b>Print Management Console:<\/b> <code>printmanagement.msc<\/code>, deploy per-user or per-machine.<\/li>\n <li><b>PowerShell:<\/b> <code>Add-PrinterDriver<\/code>, <code>Add-Printer<\/code>, <code>Set-Printer<\/code>, scriptable deployment.<\/li>\n <li><b>Canon Print Management:<\/b> uniFLOW itself can manage drivers for devices under its control.<\/li>\n<\/ol>\n\n<div class=\"warn-box\">\n<strong> Common mistake:<\/strong> Installing a 64-bit driver on a 64-bit print server but forgetting the 32-bit driver → 32-bit clients can't print. Always add <b>both architectures<\/b> (x64 + x86) on print servers in mixed-OS environments.\n<\/div>\n", "quiz": [{"q": "What is the main difference between a V3 and V4 Windows printer driver?", "options": ["V3 is older, V4 is newer with a simpler and safer driver model", "V3 is 64-bit, V4 is 32-bit", "V3 supports color, V4 is monochrome", "There is no difference"], "answer": 0, "explain": ""}, {"q": "What happens if you install the wrong printer driver on a Windows print server?", "options": ["Nothing, Windows auto-detects", "Print jobs may fail, garbled output, or driver conflicts", "The printer rewrites its firmware", "The spooler crashes permanently"], "answer": 1, "explain": ""}, {"q": "Why would you use the Canon Generic PCL 6 Driver instead of a device-specific driver?", "options": ["It's faster", "It works across multiple Canon model families for fleet standardization", "It supports more finishing options", "It's the only one available for network printers"], "answer": 1, "explain": ""}, {"q": "What tool do you use for printer driver deployment across an enterprise?", "options": ["Print Management Console (printmanagement.msc) with Group Policy", "Group Policy Management Editor only", "PowerShell Set-Printer cmdlet only", "All of the above, multiple methods work"], "answer": 3, "explain": ""}]}, {"id": "m13", "title": "Print Management: Queues, Spooler & Job Routing", "level": "advanced", "xp": 30, "summary": "How print jobs move from user to paper. Queues, spoolers, Rule-Based Routing, CRQM, DRQM, the anatomy of enterprise print.", "lesson": "<h2>Print Management: Queues, Spooler & Job Routing<\/h2>\n<p>The path from Ctrl+P to paper involves several moving parts. Understanding them is the difference between a 2-minute fix and a 2-hour call.<\/p>\n\n<h3>The Print Path (Simplified)<\/h3>\n<pre class=\"code-block\">\nUser hits Print\n → App sends data to Windows GDI / Print Pipeline\n → Print Processor translates data (RAW, EMF, XPS)\n → Print Spooler stores job on disk (Spoolsv.exe)\n → Print Router sends to correct port (9100, 445, IPP, LPR)\n → Printer receives and renders the page\n<\/pre>\n\n<h3>Print Queue<\/h3>\n<p>A <b>print queue<\/b> is a logical destination. Each queue has:<\/p>\n<ul>\n <li><b>A driver<\/b>, translates data into the printer's language (UFR II, PCL, PostScript)<\/li>\n <li><b>A port<\/b>, the connection method (IP address + port 9100, or IPP URL, or file path)<\/li>\n <li><b>A name<\/b>, what users see when they browse for printers<\/li>\n<\/ul>\n<p>You can have <b>multiple queues<\/b> for the same physical printer with different drivers. This is a legitimate deployment pattern.<\/p>\n\n<h3>Print Spooler (Spoolsv.exe)<\/h3>\n<ul>\n <li>The Windows service that <b>receives, stores, and sends<\/b> print jobs<\/li>\n <li>Jobs are stored as <b>spool files<\/b> in <code>C:WindowsSystem32spoolPRINTERS<\/code><\/li>\n <li>Two modes:\n <ul>\n <li><b>RAW:<\/b> Client renders the page → sends finished data → server just forwards it (small spool files)<\/li>\n <li><b>EMF:<\/b> Server renders the page → can reprint from server → large spool files (can choke the server)<\/li>\n <\/ul>\n <\/li>\n<\/ul>\n\n<div class=\"warn-box\">\n<strong> Spooler death spiral:<\/strong> Large EMF jobs + user retries = Spoolsv.exe memory explosion. Fix: Switch large-document users to RAW mode. Emergency: <code>net stop spooler<\/code> → delete <code>PRINTERS<\/code> folder contents → <code>net start spooler<\/code>.\n<\/div>\n\n<h3>Job Routing in uniFLOW<\/h3>\n<ul>\n <li><b>RBR (Rule-Based Routing):<\/b> Routes jobs by rules, color vs B&W, page count, cost center, time of day. Notification options: email, web pop-up, Windows Messenger.<\/li>\n <li><b>CRQM (Collective Release Queue Management):<\/b> Combines print servers into a collective. Users collect jobs from any device on any server in the collective.<\/li>\n <li><b>DRQM (Distributed Release Queue Management):<\/b> Worldwide follow-me printing. Authenticate at any device anywhere, release your jobs. Geographically distributed.<\/li>\n <li><b>RPS (Remote Print Server):<\/b> Add-on license. Collects accounting data on a remote print server and uploads to the central uniFLOW server. For branch offices with their own print server.<\/li>\n<\/ul>\n", "quiz": [{"q": "What is a print queue in Windows?", "options": ["The physical printer hardware", "A logical destination for print jobs, with a driver and port assigned", "The spooler service (Spoolsv.exe)", "The printer IP address"], "answer": 1, "explain": ""}, {"q": "What is the Windows Print Spooler service?", "options": ["A service that manages faxing", "The service (Spoolsv.exe) that receives, processes, and sends print jobs to the printer", "A driver installation tool", "A network discovery service"], "answer": 1, "explain": ""}, {"q": "What does CRQM (Collective Release Queue Management) allow users to do?", "options": ["Print from any device at any location", "Collect print jobs from any device connected to any print server in the collective", "Route jobs based on page count", "Email completed print notifications"], "answer": 1, "explain": ""}, {"q": "What is DRQM (Distributed Release Queue Management)?", "options": ["Same as CRQM but for local networks", "Allows follow-me printing across geographically distributed sites worldwide", "A driver deployment tool", "A spooler monitoring service"], "answer": 1, "explain": ""}, {"q": "RPS (Remote Print Server) is an add-on license that does what?", "options": ["Prints remotely from home", "Collects printer accounting info on a remote server and uploads to central uniFLOW", "Manages remote driver updates", "Provides VPN access for printing"], "answer": 1, "explain": ""}]}, {"id": "m14", "title": "Troubleshooting Methodology", "level": "intermediate", "xp": 25, "summary": "A repeatable 5-step process for any printer/network issue. Stop guessing and start diagnosing.", "lesson": "<h2>Troubleshooting Methodology<\/h2>\n<p>Most printer problems are solved not by luck but by following a repeatable process. This methodology works whether you are diagnosing a network issue, a driver problem, or a dead printer.<\/p>\n\n<h3>The 5-Step Methodology<\/h3>\n\n<h4>Step 1: Gather Information<\/h4>\n<ul>\n <li>What exactly is broken? (printer not printing vs wrong output vs slow)<\/li>\n <li>When did it start? (after a power outage? after an update? this morning?)<\/li>\n <li>Who is affected? (one user? one printer? everyone?)<\/li>\n <li>What changed? (new printer? new server? new driver? firmware update?)<\/li>\n <li><b>TRAP:<\/b> Never skip this step. Half of all diagnoses are wrong because the tech guessed instead of asking.<\/li>\n<\/ul>\n\n<h4>Step 2: Isolate the Issue<\/h4>\n<ul>\n <li>Divide the system: Client &rarr; Network &rarr; Server &rarr; Printer<\/li>\n <li><b>Ping the printer from the server.<\/b> Works = network layer is up. Fails = network or printer is down.<\/li>\n <li><b>Ping the server from the printer<\/b> (via panel/web interface). Works = problem is downstream.<\/li>\n <li><b>Print a config page from the printer panel.<\/b> Works = printer itself functions. Fails = printer hardware issue.<\/li>\n <li>Test with a different client, different cable, different port.<\/li>\n<\/ul>\n\n<h4>Step 3: Analyze Logs & Events<\/h4>\n<ul>\n <li><b>Event Viewer<\/b> on the print server: Application and System logs. Look for warnings at failure time.<\/li>\n <li><b>Canon RUI<\/b> (Remote User Interface) - device web page: error history, job log, network diagnostics.<\/li>\n <li><b>IWEMC<\/b> logs: device status, communication failures, counter timeouts.<\/li>\n <li><b>uniFLOW logs:<\/b> Server logs. Look for timeouts, auth failures, device agent errors.<\/li>\n <li><b>Procmon:<\/b> For install failures. Filter by process name, look for ACCESS DENIED.<\/li>\n<\/ul>\n\n<h4>Step 4: Apply Fix (One Change at a Time)<\/h4>\n<ul>\n <li>Change ONE variable. Test. If it works, you found the cause.<\/li>\n <li>Change TWO things at once and you have no idea which one fixed it.<\/li>\n <li>Common fixes by category:\n <ul>\n <li>Network: Open firewall port, change DNS, assign static IP<\/li>\n <li>Driver: Switch driver type (UFR II vs PCL 6 vs PS), reinstall<\/li>\n <li>Server: Restart spooler, clear queue, reboot<\/li>\n <li>Printer: Power cycle, reset NIC, check cable<\/li>\n <\/ul>\n <\/li>\n<\/ul>\n\n<h4>Step 5: Document & Verify<\/h4>\n<ul>\n <li>Confirm the fix works (test from the affected user machine, not just yours)<\/li>\n <li>Document: What was the symptom? What was the root cause? What fixed it?<\/li>\n <li>This is how you build expertise. The tech who documents solves problems in 10 minutes that takes others 2 hours.<\/li>\n<\/ul>\n\n<div class=\"info-box\">\n<strong>Real-world example:<\/strong> Printer offline in uniFLOW. Step 1: It was online this morning. Affects one device. No changes made. Step 2: Ping works from server. RUI works. Print from RUI fails. Step 3: Event Viewer shows Spooler error 7034. Step 4: Restart spooler service. Step 5: Print works. Documented: Spooler crash, likely from a corrupt print job.\n<\/div>\n", "quiz": [{"q": "What is the FIRST step in the troubleshooting methodology?", "options": ["Reboot everything", "Gather Information", "Swap the cable", "Call the vendor"], "answer": 1, "explain": ""}, {"q": "After isolating the issue, what comes next?", "options": ["Apply a fix", "Escalate to Level 2", "Analyze Logs and Events", "Document the solution"], "answer": 2, "explain": ""}, {"q": "Why is documenting the fix important?", "options": ["So your boss knows you worked", "For the next engineer facing the same issue - and for customer records", "To prove the customer was wrong", "It is not important"], "answer": 1, "explain": ""}, {"q": "What tool should you grab FIRST for a printer not printing call?", "options": ["A new printer", "Event Viewer + ping + the methodology", "The firmware update file", "The customer credit card"], "answer": 1, "explain": ""}]}, {"id": "m15", "title": "Physical Connectivity & Cabling", "level": "beginner", "xp": 15, "summary": "Ethernet cables, USB, power, panel menus, and what those blinking lights mean.", "lesson": "<h2>Physical Connectivity & Cabling<\/h2>\n<p>Before blaming software or network config, check the physical layer. More time is wasted on phantom network issues than on actual cabling problems.<\/p>\n\n<h3>Ethernet Cabling<\/h3>\n<ul>\n <li><b>Cat5e:<\/b> 1 Gbps, 100m max. Minimum standard for any installation.<\/li>\n <li><b>Cat6:<\/b> 10 Gbps up to 55m. Recommended for print server connections.<\/li>\n <li><b>Link lights:<\/b> Solid green = link established. Blinking = activity. Off = no physical connection.<\/li>\n <li><b>Bent pins or damaged ends<\/b> cause intermittent disconnects. The printer shows online but jobs fail randomly.<\/li>\n<\/ul>\n\n<h3>Power<\/h3>\n<ul>\n <li><b>Check the outlet.<\/b> Sounds obvious, but power strips get switched off accidentally.<\/li>\n <li><b>Surge protectors<\/b> can trip without visual indication. Test with a known-good device.<\/li>\n <li><b>Power cycles fix things.<\/b> When all else fails: unplug printer for 30 seconds, restart.<\/li>\n <li>Always check the power cable is fully seated in both the printer and the outlet.<\/li>\n<\/ul>\n\n<h3>Canon MFD Panel & Error Codes<\/h3>\n<ul>\n <li>Most Canon MFPs show a code on the display or in the RUI web interface.<\/li>\n <li><b>E### codes:<\/b> Engine/service errors. E001/E002 = fuser issues. E020/E202 = laser/drum. Need service.<\/li>\n <li><b>J### codes:<\/b> Paper jam location. J001 = tray 1 feed. J010 = registration roller.<\/li>\n <li>The RUI (Remote User Interface) at http://printer-ip/ gives the service status page without touching the device.<\/li>\n<\/ul>\n\n<h3>USB & Parallel (Legacy)<\/h3>\n<ul>\n <li>USB-connected printers need a driver installed on the specific workstation. Not suitable for enterprise.<\/li>\n <li>USB 2.0 max cable length: 5 meters. Longer runs need a powered hub.<\/li>\n <li>You will encounter parallel ports on old dot-matrix printers in warehouses. They still work.<\/li>\n<\/ul>\n\n<div class=\"warn-box\">\n<strong>Golden rule:<\/strong> When you arrive on site and find \"everything was working yesterday,\" start with Step 1 of the Troubleshooting Methodology: GATHER INFORMATION before touching anything. Often the night cleaner unplugged the printer to plug in a vacuum.\n<\/div>\n", "quiz": [{"q": "What does a solid green link light on a printer NIC mean?", "options": ["The printer is printing", "Physical link is established (Layer 1 is up)", "The network is slow", "Firmware update is needed"], "answer": 1, "explain": ""}, {"q": "What error code category starts with E on most Canon MFPs?", "options": ["Paper jam", "Service/Engine error", "Network error", "Toner low warning"], "answer": 1, "explain": ""}, {"q": "What is the FIRST thing to check when a printer has no display?", "options": ["Call Canon support", "Power cable is plugged in and outlet works", "Network cable", "Replace the control panel"], "answer": 1, "explain": ""}]}, {"id": "m16", "title": "Authentication & Access Control", "level": "advanced", "xp": 30, "summary": "How users prove who they are at the MFD. Kerberos, NTLM, card auth, PIN auth, certificate-based.", "lesson": "<h2>Authentication & Access Control<\/h2>\n<p>How does the MFD know who is standing in front of it? This is the most common source of user-facing issues.<\/p>\n\n<h3>Kerberos vs NTLM<\/h3>\n<table class=\"port-table\">\n<tr><th>Feature<\/th><th>Kerberos<\/th><th>NTLM<\/th><\/tr>\n<tr><td>Type<\/td><td>Ticket-based (token)<\/td><td>Challenge-response<\/td><\/tr>\n<tr><td>Security<\/td><td>Strong - mutual authentication<\/td><td>Weak - vulnerable to relay attacks<\/td><\/tr>\n<tr><td>Requires<\/td><td>Domain controller + time sync + SPN<\/td><td>Just a DC<\/td><\/tr>\n<tr><td>Default in AD<\/td><td>Yes (since Windows 2000)<\/td><td>Fallback only<\/td><\/tr>\n<tr><td>MFD relevance<\/td><td>Canon MFPs support Kerberos for AD auth<\/td><td>Legacy fallback for older devices<\/td><\/tr>\n<\/table>\n\n<p>If time is not synchronized between the MFD and the domain controller, Kerberos fails silently. The device falls back to NTLM or fails entirely. Always check NTP settings on the printer.<\/p>\n\n<h3>Authentication Methods at the MFD<\/h3>\n<ul>\n <li><b>PIN/Password:<\/b> User types their AD credentials on the touch panel. Simplest, slowest.<\/li>\n <li><b>Card authentication (CAC/PIV):<\/b> Smart card reader at the MFD. The card certificate must be trusted.<\/li>\n <li><b>Proximity card / HID:<\/b> Swipe a badge. The badge ID maps to the user in uniFLOW.<\/li>\n <li><b>Biometric:<\/b> Fingerprint scanner. Less common in uniFLOW deployments.<\/li>\n<\/ul>\n\n<h3>Why Authentication Fails On-Site<\/h3>\n<ul>\n <li><b>Clock skew:<\/b> MFD clock off by more than 5 minutes from the DC. Kerberos fails. Fix: Set NTP on the printer.<\/li>\n <li><b>Wrong domain:<\/b> The MFD is pointed at the wrong LDAP server or domain.<\/li>\n <li><b>Certificate chain broken:<\/b> Card auth needs the entire chain (root CA &rarr; intermediate &rarr; device cert).<\/li>\n <li><b>Account locked:<\/b> User tried 3 wrong PINs. AD account is locked. Not a printer issue.<\/li>\n<\/ul>\n\n<div class=\"info-box\">\n<strong>Official glossary reference:<\/strong> SSO is defined as: \"One-time logon method enabling a user to log on and gain access to all devices and services of a domain with a single authentication. The imageRUNNER display is locked until the user has entered valid credentials.\"\n<\/div>\n", "quiz": [{"q": "What protocol does Windows AD use as its default authentication method?", "options": ["NTLM", "Kerberos", "LDAP", "RADIUS"], "answer": 1, "explain": ""}, {"q": "Why might card authentication (CAC/PIV) fail at the MFD?", "options": ["The card reader is not configured for MEAP", "The card certificate chain cannot be validated", "The driver is wrong", "The MFD is in power save mode"], "answer": 1, "explain": ""}, {"q": "In uniFLOW, what happens when AD authentication fails at the MFD touch panel?", "options": ["The MFD reboots", "User sees Login failed and cannot access functions", "A fallback local account is used", "The job prints anyway"], "answer": 1, "explain": ""}, {"q": "What is SSO in the context of Canon MFPs?", "options": ["Single Sign-On - log in once until logout", "A standalone server", "A printer driver type", "An encryption protocol"], "answer": 0, "explain": ""}]}, {"id": "m17", "title": "Mobile Printing & Cloud", "level": "intermediate", "xp": 20, "summary": "Printing from phones, tablets, and remote locations. Mopria, AirPrint, Canon Print Business.", "lesson": "<h2>Mobile Printing & Cloud<\/h2>\n<p>Users expect to print from phones and tablets. The landscape has shifted from PC-only printing to anywhere-anytime output.<\/p>\n\n<h3>AirPrint<\/h3>\n<ul>\n <li>Apple built-in printing protocol on iOS and macOS.<\/li>\n <li>Uses <b>IPP (Internet Printing Protocol)<\/b> - the same protocol used by CUPS and modern print servers.<\/li>\n <li>No driver installation needed on the device - discovers printers via mDNS/Bonjour.<\/li>\n <li>Canon MFPs support AirPrint. Must be enabled in device settings (RUI or panel).<\/li>\n <li>If the MFD is not seen by an iPhone, check: Bonjour/mDNS enabled? Same subnet? No firewall blocking mDNS?<\/li>\n<\/ul>\n\n<h3>Mopria<\/h3>\n<ul>\n <li>The Android equivalent of AirPrint - a cross-vendor standard.<\/li>\n <li>Supported by Canon, HP, Epson, Xerox, and others.<\/li>\n <li>Works via IPP or vendor-specific protocols.<\/li>\n <li>Like AirPrint, needs mDNS discovery and the MFD on the same network segment.<\/li>\n<\/ul>\n\n<h3>Canon Print Business / Canon PRINT<\/h3>\n<ul>\n <li>Canon mobile app for printing from iOS and Android.<\/li>\n <li>For on-premises: App connects to the MFD on the local network.<\/li>\n <li>For remote: App connects via uniFLOW Online or cloud relay.<\/li>\n <li>Supports: Print, scan, copy from the phone, cloud storage integration (Box, Dropbox, OneDrive).<\/li>\n<\/ul>\n\n<h3>Microsoft Universal Print<\/h3>\n<ul>\n <li>Microsoft cloud-based print infrastructure.<\/li>\n <li>Replaces on-prem print servers with cloud-connected printers.<\/li>\n <li>No print server, no driver management, no GPO deployment needed.<\/li>\n <li>Canon MFPs support Universal Print natively via firmware update or via a connector.<\/li>\n <li>Growing adoption. Know it exists, especially for M365-heavy customers.<\/li>\n<\/ul>\n\n<div class=\"warn-box\">\n<strong>Key deployment note:<\/strong> Mobile printing (AirPrint/Mopria) uses mDNS discovery, which is link-local only. If the MFD is on a different VLAN than the user phone, mDNS will not cross the router. Solutions: mDNS reflector/relay, or use a static IPP URL in the print client.\n<\/div>\n", "quiz": [{"q": "What printing protocol does Apple AirPrint use as its foundation?", "options": ["RAW 9100", "IPP (Internet Printing Protocol)", "SMB", "LPR"], "answer": 1, "explain": ""}, {"q": "What is Mopria?", "options": ["A Samsung printing app", "A cross-vendor standard for mobile printing", "Canon cloud printing service", "A wireless cable"], "answer": 1, "explain": ""}, {"q": "To use Canon Print Business from outside, the MFD must be...", "options": ["Connected via VPN", "Reachable over internet or registered with uniFLOW Online", "On the same subnet", "Running special firmware"], "answer": 1, "explain": ""}, {"q": "What is Microsoft Universal Print?", "options": ["A printer that works with any OS", "A cloud-based print infrastructure replacing on-prem print servers", "A universal printer driver", "A print queue for any PDL"], "answer": 1, "explain": ""}]}, {"id": "m18", "title": "Security Hardening", "level": "advanced", "xp": 25, "summary": "Default passwords, firmware updates, port lockdowns, and why the #1 printer hack starts with an unsecured MFD.", "lesson": "<h2>Security Hardening<\/h2>\n<p>Printers are the most ignored security gap in enterprise IT. Every MFD on the network is a computer with an IP address, running services, and frequently running outdated code. A compromised MFD can be a pivot point into the internal network.<\/p>\n\n<h3>The Big Three<\/h3>\n\n<h4>1. Default Credentials<\/h4>\n<ul>\n <li>Canon MFPs ship with default admin credentials (often admin/12345678 or similar).<\/li>\n <li>If these are not changed, anyone on the network can access the RUI (web UI), change settings, install apps, or exfiltrate scanned documents.<\/li>\n <li><b>Fix:<\/b> Change the administrator password on every MFD during deployment. Document the new password securely (password manager, not a sticky note on the printer).<\/li>\n<\/ul>\n\n<h4>2. Open Ports<\/h4>\n<ul>\n <li>Every open port is an attack surface.<\/li>\n <li><b>TCP 9100 (RAW):<\/b> No authentication, no encryption. Anyone who reaches this port can print to it. Lock it down to the print server IP only.<\/li>\n <li><b>UDP 161 (SNMP):<\/b> Default community \"public\" gives read access, \"private\" gives write. Change these or disable if not needed.<\/li>\n <li><b>Telnet (23):<\/b> Many MFPs have it enabled. Disable it. Use SSH or RUI (HTTPS).<\/li>\n <li><b>FTP (21):<\/b> Often enabled for scan-to-FTP. If you are not using it, disable it. If you are, use SFTP or FTPS instead.<\/li>\n <li><b>Best practice:<\/b> Enable only the ports needed for your deployment. Block everything else at the firewall.<\/li>\n<\/ul>\n\n<h4>3. Firmware Updates<\/h4>\n<ul>\n <li>Canon regularly releases firmware updates that include security patches for CVEs.<\/li>\n <li>Outdated firmware is how attackers compromise MFPs to send spam or pivot to other devices.<\/li>\n <li><b>Check firmware version<\/b> on every device via RUI (Status Monitor > Firmware).<\/li>\n <li>Subscribe to Canon security bulletins or check the Canon support portal quarterly.<\/li>\n <li>Test firmware on one device before deploying fleet-wide.<\/li>\n<\/ul>\n\n<h3>Additional Best Practices<\/h3>\n<ul>\n <li><b>TLS 1.2 minimum:<\/b> uniFLOW Online requires TLS 1.2. Disable TLS 1.0/1.1 on the MFD and server.<\/li>\n <li><b>Encrypt scan-to-folder:<\/b> Use IPPS instead of HTTP. Use SMB 3.0 with encryption.<\/li>\n <li><b>Certificate management:<\/b> Replace self-signed certificates with CA-signed ones. Track expiry dates.<\/li>\n <li><b>Physical security:<\/b> Lock the MFD control panel when not in use (SSO). Place devices in view of security cameras.<\/li>\n<\/ul>\n\n<div class=\"warn-box\">\n<strong>Real-world example:<\/strong> In 2020, researchers found thousands of printers exposed on the internet with default SNMP strings and open port 9100. Anyone could send print jobs. Worse, some had remote code execution vulnerabilities from outdated firmware. This is why locking down MFDs is not optional.\n <\/div>\n", "quiz": [{"q": "What is the single most common security issue on a newly deployed MFD?", "options": ["Outdated TLS version", "Default admin credentials not changed", "Open Wi-Fi", "No firewall configured"], "answer": 1, "explain": ""}, {"q": "What port should be blocked at the firewall to prevent unauthorized RAW printing?", "options": ["TCP 443", "TCP 9100", "UDP 161", "TCP 445"], "answer": 1, "explain": ""}, {"q": "Why should you keep MFD firmware up to date?", "options": ["For new features only", "Security patches for known vulnerabilities", "To improve print speed", "It is not important for security"], "answer": 1, "explain": ""}, {"q": "What is the minimum TLS version for secure communication in uniFLOW Online?", "options": ["TLS 1.0", "TLS 1.1", "TLS 1.2", "Any version is acceptable"], "answer": 2, "explain": ""}]}], "cases": [], "scenarios": [{"id": "the-silent-printer", "title": "The Silent Printer", "prompt": "A Canon iR-ADV is discovered by IWEMC, it appears in the list, but the uniFLOW server reports it as \"Offline.\" The MFD can ping the uniFLOW server. What's the most likely cause?", "hint": "Check the firewall between the VLANs, ICMP (ping) may be allowed while a specific port is blocked.", "answer": "The CPCA port (UDP 47545) is blocked between the printer VLAN and the server VLAN. ICMP is allowed (ping works), but CPCA is needed for uniFLOW to get status updates. Fix: Open UDP 47545 from MFD→Server."}, {"id": "scan-to-folder-silent-death", "title": "Scan-to-Folder Silent Death", "prompt": "User scans a document at the MFD. It says \"Complete.\" But the file never arrives at the shared folder \\\\fileserver\\scans. What's the #1 suspect?", "hint": "SMB has gone through several versions. Old devices speak an outdated dialect.", "answer": "SMB version mismatch. WinServer 2022 requires SMB 3.0 with encryption. The older MFD only supports SMB 1.0 (disabled by default on modern Windows). Fix: Enable SMB 2.0/3.0 fallback on the MFD, or set up a scan-to-email alternative."}, {"id": "the-proxy-prisoner", "title": "The Proxy Prisoner", "prompt": "A customer deployed uniFLOW Online. Printers register fine at the office. But one branch office's MFDs keep going offline. All other internet services work. What's the pattern?", "hint": "Enterprise branches often route ALL traffic through a proxy, one that expects authentication.", "answer": "The branch uses an authenticating proxy. The MFD can't provide proxy credentials, so its outbound connection to *.uniflowonline.com is intercepted and blocked. Fix: Add *.nt-ware.com, *.uniflowonline.com, and device.c-cdsknn.net to the proxy bypass list."}, {"id": "the-dhcp-ghost", "title": "The DHCP Ghost", "prompt": "After a weekend power outage, 10 MFDs at a school can't print. Before the outage, everything worked. No config changes were made. Where do you start?", "hint": "What changes when the power comes back on, that stays the same for servers but changes for clients?", "answer": "The MFDs are on DHCP. After the outage, the DHCP server assigned them new IPs (lease was lost during downtime). uniFLOW still references the old IPs. Fix: Reserve static IPs for all MFDs in the DHCP server, or configure them as static on the device."}, {"id": "the-certificate-ghost", "title": "The Certificate Ghost", "prompt": "uniFLOW Smart Client can't connect to the server. The server is up, pingable, and HTTPS responses come back, but the client reports \"Connection not secure\" and refuses. What's wrong?", "hint": "Look at the certificate. Who signed it?", "answer": "The uniFLOW server uses a self-signed certificate (or expired CA-signed one). Smart Client requires a trusted certificate chain. Fix: Install a proper CA-signed certificate, or add the self-signed cert to the client's trusted root store."}, {"id": "the-nat-surprise", "title": "The NAT Surprise", "prompt": "A customer wants remote workers to release print jobs at the office MFD via uniFLOW On-Prem. The office has a single public IP. Why doesn't it work out of the box?", "hint": "There's a difference between outbound and inbound connections through NAT.", "answer": "NAT handles outbound connections naturally. But for the MFD to connect TO uniFLOW server FROM the internet, you need port forwarding on the office router: map public IP:443 → uniFLOW server:443. Plus a firewall rule to allow it. Multi-factor auth required for security."}, {"id": "the-missing-counters", "title": "The Missing Counters", "prompt": "The customer's billing department notices counter readings haven't updated for 3 days on some MFDs. The MFDs are online and printing fine. uniFLOW shows no errors. What's likely?", "hint": "Counter reading uses a different protocol than printing. If one works but the other doesn't...", "answer": "SNMP (UDP 161) is blocked for those specific MFDs. Print jobs use TCP 9100 or HTTPS, those work. But SNMP queries for page counters are silently dropped. Fix: Check firewall rules for UDP 161 from uniFLOW server to the affected MFDs."}, {"id": "the-vlan-maze", "title": "The VLAN Maze", "prompt": "New building, same company. They moved 20 MFDs to a new wing. The printers are on VLAN 100. The uniFLOW server is on VLAN 10. Segments are routed through a firewall. Nothing works. What do you need?", "hint": "Count the data paths. Every arrow in the architecture diagram is a firewall requirement.", "answer": "You need firewall rules allowing traffic between VLAN 100 and VLAN 10 on: TCP 443 (authentication, job release), UDP 47545 (CPCA status), UDP 161 (SNMP discovery), TCP 9100 (if sending print jobs directly), and TCP 445 (scan-to-folder if on VLAN 100). Also ensure DNS can resolve across VLANs."}, {"id": "the-wrong-language", "title": "The Wrong Language", "prompt": "A customer deployed a fleet of Canon imageRUNNER ADVANCE devices. Some users print from a specialized accounting application that uses PostScript exclusively. The Canon Generic UFR II driver is installed everywhere. Accounting users get garbled pages, symbols instead of text. What's happening and how do you fix it?", "hint": "A printer language is like a foreign accent. If you speak French to someone who only understands Spanish...", "answer": "The accounting app generates PostScript data, but the UFR II driver doesn't understand it. Fix: (a) Install the Canon Generic PostScript driver on the accounting users' machines, or (b) configure a separate print queue with the PostScript driver pointed at the same device. Many Canon MFPs can auto-detect PDL if the data is wrapped correctly."}, {"id": "the-spooler-hang", "title": "The Spooler Hang", "prompt": "A Windows print server crashes every Thursday afternoon at 2 PM. Event Viewer shows Spoolsv.exe consuming 8GB RAM before dying. The queue has 400+ pending jobs. Users resubmit when jobs disappear, making it worse. What's the root cause and the two-step fix?", "hint": "Large print jobs + queue not clearing + users compounding the problem = death spiral.", "answer": "Root cause: A single massive PDF (500+ pages, high-res graphics) held as EMF in the spooler. Each resubmission adds more. Fix: (1) Clear stuck jobs (net stop spooler and delete PRINTERS folder, net start spooler). (2) Change spooler to \"Start printing immediately\" to prevent EMF accumulation. Long-term: Switch large-document users to RAW mode to render on client instead of server."}, {"id": "the-authentication-lockout", "title": "The Authentication Lockout", "prompt": "A hospital has 30 Canon MFPs with card reader authentication. Users swipe badges to release print jobs. On Monday morning, 50+ nurses report they cannot print. The error says \"Authentication failed.\" IT says AD is fine. What is the likely cause and why Monday morning?", "hint": "Think about what happens over a weekend. AD accounts are fine. The MFDs...", "answer": "The MFD clocks drifted over the weekend (no NTP sync). When users swiped badges, Kerberos authentication failed because the device clock was more than 5 minutes off from the domain controller. Fix: Set NTP servers on all MFDs via RUI (Network Settings > NTP). Prevention: Add NTP config as a deployment step in every new install."}, {"id": "the-mobile-print-mystery", "title": "The Mobile Print Mystery", "prompt": "A law firm installed new Canon MFPs. Attorneys can print from computers, but cannot print from iPhones/iPads. MFPs do not appear in iOS Print dialog. AirPrint is supported. Everything on same Wi-Fi. What is happening?", "hint": "AirPrint uses a protocol to discover printers. What happens when that protocol hits a network boundary?", "answer": "AirPrint uses mDNS/Bonjour for discovery (port 5353 UDP). mDNS is link-local - it does not cross VLANs. Corporate networks segment Wi-Fi and wired into different subnets/VLANs. MFPs on wired VLAN, iPhones on Wi-Fi VLAN. Fix: (1) Enable mDNS reflector/relay. Or (2) Configure IPP printing with the MFD IP directly. Or (3) Move MFPs to Wi-Fi VLAN."}, {"id": "the-open-door", "title": "The Open Door", "prompt": "A new customer has 15 Canon MFPs deployed six months ago by another vendor. The uniFLOW server and printers communicate fine. But during a security review, the customer's IT team finds all 15 MFPs have the factory-default admin password, SNMP community \"public\" enabled, and port 9100 open to the entire LAN. What should you do as immediate actions?", "hint": "Think in order of risk: What gives an attacker the most access first? Then lock down the rest.", "answer": "Immediate priority: (1) Change admin passwords on all 15 MFDs. This prevents RUI takeover. (2) Restrict SNMP community string to a read-only custom value known only to uniFLOW. (3) Create a firewall rule limiting TCP 9100 access to the print server IP only. (4) Check firmware version and update if it is more than 12 months old. (5) Document and schedule for a full security audit every quarter. Deployers should do this at install time, not retroactively."}], "glossary": [{"term": "ACE (Access Control Entry)", "definition": "Access Control Entries can either be users or groups of users, or printers. After selection of an ACE, you can decide to add it to the Access Allowed List or the Access Denied List, depending on the permission you would like to give the user or group in question."}, {"term": "ACL (Access Control List)", "definition": "An ACL consists of Access Control Entries (ACE). Access Control Entries can either be users or groups of users, or printers. After sel
