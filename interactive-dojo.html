ection of an ACE, you can decide to add it to the Access Allowed List or the Access Denied List, depending on the permission you would like to give the user, group, or printer in question."}, {"term": "AD (Active Directory)", "definition": "Active directory is a Windows directory service included in most Windows server systems. It stores information of objects on the network within a database. Most commonly, data about users, printer queues or network configuration is stored."}, {"term": "AES (Advanced Encryption Standard)", "definition": "One of the most popular algorithms used in symmetric key cryptography. AES has a fixed block size of 128 bits, and a key size of 128, 192, or 256 bits. AES is part of the ISO/IEC 18033/3 standard."}, {"term": "AMS (Access Management System)", "definition": "A system developed by Canon that provides access management possibilities on a per feature basis for imageRUNNER devices."}, {"term": "ApjPrint", "definition": "Print processor used by uniFLOW to monitor print jobs in a Windows Spooler. Includes functionality to automatically start uniFLOW services and auto-print jobs if the server or database cannot be reached."}, {"term": "CAC (Common Access Card)", "definition": "A standard identification card issued by the US DoD for general identification and for authentication."}, {"term": "CAPT (Canon Advanced Printing Technology)", "definition": "Enhances increasingly powerful PC CPUs, sending rendering data processed by the PC to the printer for printing. Reduces load on the printer CPU."}, {"term": "CPCA (Common Peripheral Controlling Architecture)", "definition": "A proprietary communication protocol developed by Canon to communicate with multi-functional devices (MFP). Controls all MFP functionality including printing, copying, scanning, and mailbox management. CPCA is implemented in MEAP as a Java class library. Functions include copy/scan/print job submission, job management (cancel/hold/resume), device management (status, settings), log management (job history), and mailbox/document management."}, {"term": "CRQM (Collective Release Queue Management)", "definition": "In uniFLOW you can combine print servers into a collective. With CRQM, users are able to collect each of their print jobs from any device connected to a print server in the collective."}, {"term": "CSI (Connectivity Services Interface)", "definition": "A connector which can be accessed through different plug-ins. Used in Workflow Elements of scan workflows targeted to scan to different document management systems."}, {"term": "CUPS (Common Unix Printing System)", "definition": "A modular printing system for Unix-like operating systems that allows a computer to act as a print server. Accepts print jobs from clients, processes them, and sends them to the appropriate printer."}, {"term": "DDT (Device Discovery Task)", "definition": "A uniFLOW function used to configure a periodic scan of one or more network segments to find and automatically configure printers."}, {"term": "DHCP (Dynamic Host Configuration Protocol)", "definition": "A protocol for assigning dynamic IP addresses to devices on a network. With dynamic addressing, a device can have a different IP address every time it connects to the network."}, {"term": "DIF (Device Information File)", "definition": "uniFLOW is based on a DIF concept for storing device information. All device related information is stored into one single hierarchical XML file, including CPCA and SNMP information, PPD settings, Raster Data, and General Capabilities."}, {"term": "DNS (Domain Name System)", "definition": "A hierarchical, distributed database that contains mappings of DNS domain names to various types of data, such as IP addresses. DNS enables the location of computers and services by user-friendly names."}, {"term": "DRQM (Distributed Release Queue Management)", "definition": "Allows the worldwide following of a print job to the identifying user. Jobs are released anywhere users identify themselves, enabling follow-me printing across geographically distributed sites."}, {"term": "DsPcDb", "definition": "Name of the uniFLOW database. uniFLOW uses a SQL based relational database managed by a relational database management system (RDBMS)."}, {"term": "Dual Registration (Hybrid Mode)", "definition": "When a device is connected to both a uniFLOW server and a uniFLOW Online tenant in a hybrid environment. Users can log in and use data from both environments depending on configuration."}, {"term": "EAI (Embedded Applet Interface)", "definition": "Interface to integrate Non-Canon Device Applets in uniFLOW. Used to enable Secure Public Printing on Non-Canon-Device-Applets."}, {"term": "ESC/P 2 (Epson Standard Code for Printers)", "definition": "Epson's proprietary printer control language used for printing on Epson dot matrix and inkjet printers. Superseded by ESC/P 2."}, {"term": "FQDN (Fully Qualified Domain Name)", "definition": "A complete domain name that includes the hostname and domain name. Used in certificate validation and DNS resolution. Critical for uniFLOW to resolve server names correctly."}, {"term": "GDI (Graphic Device Interface)", "definition": "Microsoft Windows standard for representing graphical objects and transmitting them to output devices such as monitors and printers."}, {"term": "GUID (Globally Unique Identifier)", "definition": "A unique reference number used as an identifier in software. In uniFLOW, used for identifying workflows, agents, and other entities."}, {"term": "Hotfolder Monitor", "definition": "Device Agent that monitors a folder on the hard drive for incoming print files. When found, inserted into the spooler. Note: uniFLOW server runs as Local Service, cannot access network shares without account change."}, {"term": "ICMP", "definition": "Internet Control Message Protocol. Used by Device Agents to check if a device is online before establishing contact via HTML (\"Ping Check\")."}, {"term": "ICARUS Server", "definit <script>
// @ts-check
// Pure rules shared by the served app and the offline build: progress, XP, level, achievements,
// and local grading for the offline build. Mirrors dojo/grading.py; tests/test_core_parity.py
// runs both on the same golden attempt logs.
(function (root) {
  "use strict";

  /** @param {any} course @param {Array<[string, boolean]>} quizRows @param {Array<[string, number, boolean]>} stepRows @param {any} extras */
  function progress(course, quizRows, stepRows, extras) {
    const mods = new Map(course.modules.map((/** @type {any} */ m) => [m.id, m]));
    const cases = new Map(course.cases.map((/** @type {any} */ c) => [c.id, c]));
    /** @type {Record<string, {attempts:number, passed:boolean, first_try:boolean}>} */
    const modules = {};
    for (const [mid, passed] of quizRows) {
      if (!mods.has(mid)) continue;
      const m = modules[mid] || (modules[mid] = { attempts: 0, passed: false, first_try: false });
      m.attempts += 1;
      if (passed && !m.passed) { m.passed = true; m.first_try = m.attempts === 1; }
    }
    /** @type {Record<string, {done:boolean, mistakes:number}>} */
    const cs = {};
    /** @type {Record<string, Set<number>>} */
    const solved = {};
    for (const [cid, step, correct] of stepRows) {
      const c = cases.get(cid);
      if (!c) continue;
      const st = cs[cid] || (cs[cid] = { done: false, mistakes: 0 });
      if (st.done) continue;
      if (correct) {
        (solved[cid] || (solved[cid] = new Set())).add(step);
        st.done = solved[cid].size === c.steps.length;
      } else st.mistakes += 1;
    }
    return { modules, cases: cs, extras: extras || {} };
  }

  /** @param {any} course @param {any} prog */
  function xp(course, prog) {
    let t = 0;
    for (const m of course.modules) if (prog.modules[m.id] && prog.modules[m.id].passed) t += m.xp;
    for (const c of course.cases) if (prog.cases[c.id] && prog.cases[c.id].done) t += c.xp;
    if (prog.extras && prog.extras.ports_perfect) t += course.ports_xp;
    return t;
  }

  /** @param {any} course @param {number} points @returns {[number, number, number]} */
  function level(course, points) {
    let lvl = 1;
    while (points >= lvl * course.xp_per_level) { points -= lvl * course.xp_per_level; lvl += 1; }
    return [lvl, points, lvl * course.xp_per_level];
  }

  /** @param {any} course @param {any} prog @returns {Set<string>} */
  function achievements(course, prog) {
    const got = new Set();
    const passed = Object.values(prog.modules).filter((/** @type {any} */ m) => m.passed).length;
    const done = Object.values(prog.cases).filter((/** @type {any} */ c) => c.done);
    const ex = prog.extras || {};
    for (const a of course.achievements) {
      const r = a.rule;
      const need = (/** @type {number} */ total) => (r.count === "all" ? total : r.count);
      let ok = false;
      if (r.type === "modules_passed") ok = passed >= need(course.modules.length);
      else if (r.type === "first_try_all") ok = course.modules.every((/** @type {any} */ m) => prog.modules[m.id] && prog.modules[m.id].first_try);
      else if (r.type === "ports_perfect") ok = !!ex.ports_perfect;
      else if (r.type === "scenarios_all") ok = (ex.scenarios || []).length >= course.scenarios.length;
      else if (r.type === "glossary_opened") ok = (ex.glossary || []).length >= need(course.glossary.length);
      else if (r.type === "cases_done") ok = course.cases.length > 0 && done.length >= need(course.cases.length);
      else if (r.type === "case_clean") ok = done.some((/** @type {any} */ c) => c.mistakes === 0);
      else if (r.type === "module") ok = !!(prog.modules[r.id] && prog.modules[r.id].passed);
      if (ok) got.add(a.id);
    }
    return got;
  }

  /** Offline grading: the offline build carries the answer key. @param {any} mod @param {number[]} answers */
  function gradeQuiz(mod, answers) {
    const correct = mod.quiz.map((/** @type {any} */ q, /** @type {number} */ i) => answers[i] === q.answer);
    return { correct, passed: correct.every(Boolean), explain: mod.quiz.map((/** @type {any} */ q) => q.explain || "") };
  }

  /** @param {any} c @param {number} step @param {number} choice */
  function checkStep(c, step, choice) {
    const o = c.steps[step].options[choice];
    const finished = !!o.correct && step === c.steps.length - 1;
    return { correct: !!o.correct, feedback: o.feedback, finished,
      reveal: finished ? { root_cause: c.root_cause, fix: c.fix, lesson: c.lesson } : {} };
  }

  const api = { progress, xp, level, achievements, gradeQuiz, checkStep };
  if (typeof module === "object" && module.exports) module.exports = api;
  else /** @type {any} */ (root).DojoCore = api;
})(typeof globalThis !== "undefined" ? globalThis : this);
</script>

// @ts-check
// Dojo UI. One file, no build step, no inline handlers (strict CSP): every click goes through the
// delegated listener on #app via data-act attributes. The URL hash is the source of truth.

(function () {
  "use strict";
  const Core = /** @type {any} */ (window).DojoCore;
  const $ = (/** @type {string} */ s) => /** @type {HTMLElement} */ (document.querySelector(s));

  /** @typedef {{progress:any, xp:number, level:number, level_xp:number, level_need:number}} Prog */

  function remoteBackend() {

        method: method || "POST", credentials: "same-origin",

      /** @param {string} cid @param {number} step @param {number} choice */
      step: (cid, step, choice) => call(`/api/case/${cid}/step`, { step, choice }),

      offline: true,
      async boot() { return { course, me: { user: "you", manager: false }, progress: prog(load()) }; },
      async quiz(/** @type {string} */ mid, /** @type {number[]} */ answers) {

      async step(/** @type {string} */ cid, /** @type {number} */ step, /** @type {number} */ choice) {

        const r = Core.checkStep(c, step, choice);
        const d = load(); d.steps.push([cid, step, r.correct]); save(d);
        return { ...r, progress: prog(d) };
      },
      async extras(/** @type {any} */ extras) { const d = load(); d.extras = extras; save(d); return { progress: prog(d) }; },
      async team() { throw new Error("The team view needs the served dojo."); },
    };
  }

  // ---------------------------------------------------------------- state
  const backend = /** @type {any} */ (window).DOJO_COURSE ? localBackend() : remoteBackend();
  /** @type {any} */ let course;
  /** @type {any} */ let me;
  /** @type {any} */ let prog;
  /** @type {Record<string, number>} */ const picks = {};          // quiz selections, "m01:0" -> option
  /** @type {Record<string, any>} */ let lastQuiz = {};             // module id -> last graded result
  /** @type {Record<string, {step:number, log:any[], reveal:any}>} */ const caseRun = {};
  let glossaryShown = 25;
  /** @type {{left:number|null, matched:Record<number, number>, wrong:number, order:number[]}} */
  let ports = { left: null, matched: {}, wrong: 0, order: [] };

  function extras() {
    const e = prog.extras || {};
    return { scenarios: [...(e.scenarios || [])], glossary: [...(e.glossary || [])], ports_perfect: !!e.ports_perfect };
  }
  async function pushExtras(/** @type {any} */ e) { try { prog = (await backend.extras(e)).progress; } catch (err) { toast(String(err)); } renderBar(); }

  // ---------------------------------------------------------------- shell
  const TABS = [["learn", "Learn"], ["cases", "Field cases"], ["scenarios", "Scenarios"], ["ports", "Port match"], ["glossary", "Glossary"]];

  function renderBar() {
    const got = Core.achievements(course, prog);
    const passed = Object.values(prog.modules).filter((/** @type {any} */ m) => m.passed).length;
    const pct = Math.min(100, Math.round((prog.level_xp / prog.level_need) * 100));
    $("#bar").innerHTML = `
      <span class="stat"><b>Level ${prog.level}</b></span>
      <span class="stat meter" title="${prog.level_xp} of ${prog.level_need} XP"><span class="meter-fill"></span></span>
      <span class="stat">${prog.xp} XP</span>
      <span class="stat">Modules ${passed}/${course.modules.length}</span>
      <a class="stat link" href="#/awards">Awards ${got.size}/${course.achievements.length}</a>
      <span class="stat who">${backend.offline ? "Offline copy, progress saved in this browser" : esc(me.user)}</span>`;
    /** @type {HTMLElement} */ ($("#bar .meter-fill")).style.width = pct + "%"; // CSSOM, allowed by the CSP
    const tabs = me.manager ? [...TABS, ["team", "Team"]] : TABS;
    const cur = route()[0];
    const sel = (/** @type {string} */ id) => cur === id || (cur === "m" && id === "learn") || (cur === "c" && id === "cases");
    // phone: three tabs stay in the bar, the rest sit behind a labelled More menu (DESIGN D5)
    const link = (/** @type {string[]} */ [id, label], /** @type {number} */ i) =>
      `<a role="tab" href="#/${id}" class="${i >= 3 ? "wide-only" : ""}" aria-selected="${sel(id)}">${label}</a>`;
    const rest = tabs.slice(3);
    $("#tabs").innerHTML = tabs.map(link).join("") +
      `<details class="more"><summary${rest.some(([id]) => sel(id)) ? ' aria-current="page"' : ""}>More</summary><div class="menu">${rest.map(([id, label]) =>
        `<a href="#/${id}" aria-selected="${sel(id)}">${label}</a>`).join("")}</div></details>`;
  }

  function route() { return (location.hash.replace(/^#\/?/, "") || "learn").split("/"); }
  function toast(/** @type {string} */ msg) {
    const t = $("#toast"); t.textContent = msg; t.hidden = false;
    setTimeout(() => { t.hidden = true; }, 4000);
  }

  function render() {
    const [view, id] = route();
    renderBar();
    const main = $("#main");
    const views = /** @type {Record<string, Function>} */ ({ learn: viewLearn, m: () => viewModule(id), cases: viewCases, c: () => viewCase(id),
      scenarios: viewScenarios, ports: viewPorts, glossary: viewGlossary, awards: viewAwards, team: viewTeam });
    const fn = views[view];
    if (!fn) { main.innerHTML = `<p class="empty">This page does not exist. <a href="#/learn">Back to the modules</a>.</p>`; return; }
    const out = fn();
    if (out instanceof Promise) out.then((h) => { main.innerHTML = h; }).catch((e) => { main.innerHTML = `<p class="empty">${esc(e.message)}</p>`; });
    else main.innerHTML = out;
    document.title = `${course.title}`;
  }

  // ---------------------------------------------------------------- learn
  function statusOf(/** @type {string} */ mid) {
    const s = prog.modules[mid];
    if (!s) return ["todo", "Not started"];
    if (s.passed) return ["done", s.first_try ? "Passed first try" : "Passed"];
    return ["tried", `${s.attempts} attempt${s.attempts > 1 ? "s" : ""}`];
  }

  function viewLearn() {
    const rows = course.modules.map((/** @type {any} */ m, /** @type {number} */ i) => {
      const [cls, label] = statusOf(m.id);
      return `<a class="card mod ${cls}" href="#/m/${m.id}">
        <span class="num">${String(i + 1).padStart(2, "0")}</span>
        <span class="body"><b>${esc(m.title)}</b><span class="sum">${esc(m.summary)}</span>
        <span class="meta"><span class="badge lvl-${m.level}">${m.level}</span><span>+${m.xp} XP</span><span class="st">${label}</span></span></span></a>`;
    }).join("");
    return `<h1>Modules</h1><p class="lead">Read the lesson, then pass the quiz. Every answer must be right to pass; you can retry.</p><div class="grid">${rows}</div>`;
  }

  function viewModule(/** @type {string} */ mid) {
    const i = course.modules.findIndex((/** @type {any} */ m) => m.id === mid);
    if (i < 0) return `<p class="empty">No such module. <a href="#/learn">Back to the modules</a>.</p>`;
    const m = course.modules[i];
    const res = lastQuiz[mid];
    const qs = m.quiz.map((/** @type {any} */ q, /** @type {number} */ qi) => {
      const opts = q.options.map((/** @type {string} */ o, /** @type {number} */ oi) => {
        const sel = picks[`${mid}:${qi}`] === oi;
        let cls = sel ? "opt sel" : "opt";
        if (res && sel) cls += res.correct[qi] ? " right" : " wrong";
        return `<button type="button" class="${cls}" data-act="pick" data-m="${mid}" data-q="${qi}" data-o="${oi}" aria-pressed="${sel}">${esc(o)}</button>`;
      }).join("");
      const verdict = res ? `<p class="verdict ${res.correct[qi] ? "ok" : "no"}">${res.correct[qi] ? "Correct." : "Not this one."}${res.correct[qi] && res.explain[qi] ? " " + esc(res.explain[qi]) : ""}</p>` : "";
      return `<fieldset class="q"><legend>${qi + 1}. ${esc(q.q)}</legend><div class="opts">${opts}</div>${verdict}</fieldset>`;
    }).join("");
    const done = prog.modules[mid] && prog.modules[mid].passed;
    const prev = course.modules[i - 1], next = course.modules[i + 1];
    return `<nav class="crumbs"><a href="#/learn">Modules</a> / ${esc(m.title)}</nav>
      <article class="lesson">${m.lesson}</article>
      <section class="quiz" aria-label="Quiz"><h2>Quiz</h2>${qs}
        <div class="row"><button type="button" class="btn primary" data-act="grade" data-m="${mid}">Check answers</button>
        ${res ? `<span class="result ${res.passed ? "ok" : "no"}">${res.passed ? `Passed. +${m.xp} XP` : `${res.correct.filter(Boolean).length} of ${res.correct.length} right. Fix the wrong ones and check again.`}</span>` : done ? `<span class="result ok">Already passed</span>` : ""}</div>
      </section>
      <nav class="pager">${prev ? `<a class="btn" href="#/m/${prev.id}">Previous: ${esc(prev.title)}</a>` : "<span></span>"}${next ? `<a class="btn" href="#/m/${next.id}">Next: ${esc(next.title)}</a>` : ""}</nav>`;
  }

  // ---------------------------------------------------------------- cases
  function viewCases() {
    if (!course.cases.length) return `<h1>Field cases</h1><p class="empty">No field cases in this copy.</p>`;
    const rows = course.cases.map((/** @type {any} */ c) => {
      const s = prog.cases[c.id];
      const st = s && s.done ? (s.mistakes ? `Solved, ${s.mistakes} wrong choice${s.mistakes > 1 ? "s" : ""}` : "Solved clean") : s ? "In progress" : "Not started";
      return `<a class="card mod ${s && s.done ? "done" : s ? "tried" : "todo"}" href="#/c/${c.id}"><span class="body"><b>${esc(c.title)}</b>
        <span class="sum">${esc(c.situation)}</span><span class="meta">${c.review === "draft" ? '<span class="badge draft">draft</span>' : ""}<span>${c.steps.length} steps</span><span>+${c.xp} XP</span><span class="st">${st}</span></span></span></a>`;
    }).join("");
    return `<h1>Field cases</h1><p class="lead">Real cases from the field, anonymised. Pick the next move at each step; a wrong pick explains itself and costs nothing but pride.</p><div class="grid">${rows}</div>`;
  }

  function viewCase(/** @type {string} */ cid) {
    const c = course.cases.find((/** @type {any} */ x) => x.id === cid);
    if (!c) return `<p class="empty">No such case. <a href="#/cases">Back to the cases</a>.</p>`;
    const run = caseRun[cid] || (caseRun[cid] = { step: 0, log: [], reveal: null });
    const past = run.log.map((e) => `<div class="turn ${e.correct ? "ok" : "no"}"><p class="pick">${esc(e.text)}</p><p>${esc(e.feedback)}</p></div>`).join("");
    let now = "";
    if (run.reveal) {
      now = `<section class="reveal"><h2>What it was</h2><p>${esc(run.reveal.root_cause)}</p><h3>Fix</h3><ol>${run.reveal.fix.map((/** @type {string} */ f) => `<li>${esc(f)}</li>`).join("")}</ol>
        <h3>Take away</h3><p class="lesson-line">${esc(run.reveal.lesson)}</p>
        <div class="row"><button type="button" class="btn" data-act="case-reset" data-c="${cid}">Run it again</button><a class="btn" href="#/cases">All cases</a></div></section>`;
    } else {
      const s = c.steps[run.step];
      now = `<fieldset class="q"><legend>Step ${run.step + 1} of ${c.steps.length}. ${esc(s.prompt)}</legend><div class="opts">${s.options.map((/** @type {any} */ o, /** @type {number} */ oi) =>
        `<button type="button" class="opt" data-act="step" data-c="${cid}" data-o="${oi}">${esc(o.text)}</button>`).join("")}</div></fieldset>`;
    }
    return `<nav class="crumbs"><a href="#/cases">Field cases</a> / ${esc(c.title)}</nav>
      <h1>${esc(c.title)}</h1><p class="src">${esc(c.source)}${c.review === "draft" ? ' <span class="badge draft">draft, pending review</span>' : ""}</p>
      <p class="situation">${esc(c.situation)}</p>${past}${now}`;
  }

  // ---------------------------------------------------------------- scenarios, glossary, ports
  function viewScenarios() {
    const seen = new Set((prog.extras && prog.extras.scenarios) || []);
    return `<h1>Scenarios</h1><p class="lead">Think it through first, then open the hint or the answer.</p>` + course.scenarios.map((/** @type {any} */ s) =>
      `<section class="card scen"><h2>${esc(s.title)}${seen.has(s.id) ? ' <span class="badge ok">worked</span>' : ""}</h2><p>${esc(s.prompt)}</p>
       <details><summary>Hint</summary><p>${esc(s.hint)}</p></details>
       <details data-scen="${esc(s.id)}"><summary>Answer</summary><p>${esc(s.answer)}</p></details></section>`).join("");
  }

  function viewGlossary() {
    const q = /** @type {HTMLInputElement|null} */ (document.querySelector("#gq"));
    const term = (q ? q.value : "").trim().toLowerCase();
    const all = course.glossary.filter((/** @type {any} */ g) => !term || (g.term + " " + g.definition).toLowerCase().includes(term));
    const shown = all.slice(0, glossaryShown);
    const list = shown.map((/** @type {any} */ g) => `<details class="gl" data-term="${esc(g.term)}"><summary>${esc(g.term)}</summary><p>${esc(g.definition)}</p></details>`).join("");
    const more = all.length > shown.length ? `<button type="button" class="btn" data-act="more">Show ${Math.min(25, all.length - shown.length)} more (${all.length - shown.length} left)</button>` : "";
    return `<h1>Glossary</h1><input id="gq" type="search" placeholder="Search ${course.glossary.length} terms" value="${esc(term)}" aria-label="Search the glossary">
      <p class="lead">${all.length} term${all.length === 1 ? "" : "s"}</p><div class="glossary">${list || '<p class="empty">No term matches.</p>'}</div>${more}`;
  }

  function viewPorts() {
    if (!ports.order.length) ports.order = shuffle(course.ports.map((/** @type {any} */ _p, /** @type {number} */ i) => i));
    const done = Object.keys(ports.matched).length;
    const left = course.ports.map((/** @type {any} */ p, /** @type {number} */ i) =>
      `<button type="button" class="opt ${ports.left === i ? "sel" : ""} ${i in ports.matched ? "right" : ""}" data-act="pl" data-i="${i}" ${i in ports.matched ? "disabled" : ""}>${esc(p.protocol)}</button>`).join("");
    const used = new Set(Object.values(ports.matched));
    const right = ports.order.map((i) =>
      `<button type="button" class="opt num ${used.has(i) ? "right" : ""}" data-act="pr" data-i="${i}" ${used.has(i) ? "disabled" : ""}>${course.ports[i].port}</button>`).join("");
    const win = done === course.ports.length;
    return `<h1>Port match</h1><p class="lead">Pick a protocol, then its port. ${done} of ${course.ports.length} matched, ${ports.wrong} wrong.</p>
      <div class="ports"><div class="opts">${left}</div><div class="opts">${right}</div></div>
      <div class="row">${win ? `<span class="result ${ports.wrong ? "" : "ok"}">${ports.wrong ? "All matched. Do a round with no wrong pick to earn Port Master." : "Perfect round."}</span>` : ""}<button type="button" class="btn" data-act="ports-reset">New round</button></div>`;
  }
  function shuffle(/** @type {number[]} */ a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  // ---------------------------------------------------------------- awards, team
  function viewAwards() {
    const got = Core.achievements(course, prog);
    return `<h1>Awards</h1><div class="grid">${course.achievements.map((/** @type {any} */ a) =>
      `<div class="card award ${got.has(a.id) ? "done" : "todo"}"><b>${esc(a.name)}</b><span class="sum">${esc(a.desc)}</span><span class="st">${got.has(a.id) ? "Earned" : "Locked"}</span></div>`).join("")}</div>`;
  }

  async function viewTeam() {
    if (!me.manager) return `<p class="empty">The team view is for managers.</p>`;
    const t = await backend.team();
    if (!t.learners.length) return `<h1>Team</h1><p class="empty">Nobody has started yet. Share the link: everyone with an SSO account can train.</p>`;
    const head = t.module_ids.map((/** @type {string} */ id) => `<th title="${esc((course.modules.find((/** @type {any} */ m) => m.id === id) || {}).title || id)}">${id.slice(1)}</th>`).join("");
    const rows = t.learners.map((/** @type {any} */ l) => `<tr><th scope="row">${esc(l.user)}</th><td>${l.level}</td><td>${l.xp}</td><td>${l.modules_passed}/${t.module_ids.length}</td><td>${l.cases_done}/${t.case_ids.length}</td>
      ${t.module_ids.map((/** @type {string} */ id) => { const s = l.modules[id]; return `<td class="cell ${s ? (s.passed ? "done" : "tried") : ""}" title="${s ? `${s.attempts} attempt(s)` : "not started"}">${s ? (s.passed ? (s.first_try ? "1st" : "ok") : s.attempts + "x") : ""}</td>`; }).join("")}
      <td>${esc((l.last || "").replace("T", " ").slice(0, 16))}</td></tr>`).join("");
    return `<h1>Team</h1><p class="lead">${t.learners.length} learner${t.learners.length > 1 ? "s" : ""}. Cells: 1st = passed first try, ok = passed, 3x = attempts so far. Times UTC.</p>
      <div class="table-wrap"><table class="team"><thead><tr><th>Learner</th><th>Level</th><th>XP</th><th>Modules</th><th>Cases</th>${head}<th>Last active</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  // ---------------------------------------------------------------- events
  async function act(/** @type {HTMLElement} */ el) {
    const a = el.dataset.act;
    if (a === "pick") {
      picks[`${el.dataset.m}:${el.dataset.q}`] = Number(el.dataset.o);
      delete lastQuiz[/** @type {string} */ (el.dataset.m)]; render();
    } else if (a === "grade") {
      const mid = /** @type {string} */ (el.dataset.m);
      const m = course.modules.find((/** @type {any} */ x) => x.id === mid);
      const answers = m.quiz.map((/** @type {any} */ _q, /** @type {number} */ qi) => picks[`${mid}:${qi}`]);
      if (answers.some((/** @type {any} */ x) => x === undefined)) { toast("Answer every question first."); return; }
      try { const r = await backend.quiz(mid, answers); lastQuiz[mid] = r; prog = r.progress; } catch (e) { toast(String(e)); }
      render();
    } else if (a === "step") {
      const cid = /** @type {string} */ (el.dataset.c);
      const run = caseRun[cid]; const c = course.cases.find((/** @type {any} */ x) => x.id === cid);
      const choice = Number(el.dataset.o);
      try {
        const r = await backend.step(cid, run.step, choice);
        prog = r.progress;
        run.log.push({ text: c.steps[run.step].options[choice].text, feedback: r.feedback, correct: r.correct });
        if (r.correct) { if (r.finished) run.reveal = r.reveal; else run.step += 1; }
      } catch (e) { toast(String(e)); }
      render();
    } else if (a === "case-reset") {
      delete caseRun[/** @type {string} */ (el.dataset.c)]; render();
    } else if (a === "more") {
      glossaryShown += 25; render();
    } else if (a === "pl") {
      ports.left = Number(el.dataset.i); render();
    } else if (a === "pr") {
      if (ports.left === null) { toast("Pick a protocol first."); return; }
      const i = Number(el.dataset.i);
      if (i === ports.left) ports.matched[i] = i; else ports.wrong += 1;
      ports.left = null; render();
      if (Object.keys(ports.matched).length === course.ports.length && ports.wrong === 0 && !extras().ports_perfect) {
        const e = extras(); e.ports_perfect = true; await pushExtras(e); render();
      }
    } else if (a === "ports-reset") {
      ports = { left: null, matched: {}, wrong: 0, order: [] }; render();
    }
  }

  function wire() {
    const app = $("#app");
    app.addEventListener("click", (ev) => {
      const el = /** @type {HTMLElement|null} */ (/** @type {HTMLElement} */ (ev.target).closest("[data-act]"));
      if (el && !(/** @type {HTMLButtonElement} */ (el).disabled)) { ev.preventDefault(); act(el); }
    });
    // <details> open events do not bubble: capture them to record scenarios and glossary terms
    app.addEventListener("toggle", (ev) => {
      const d = /** @type {HTMLDetailsElement} */ (ev.target);
      if (!d.open) return;
      const e = extras();
      if (d.dataset.scen && !e.scenarios.includes(d.dataset.scen)) { e.scenarios.push(d.dataset.scen); pushExtras(e); }
      else if (d.dataset.term && !e.glossary.includes(d.dataset.term)) { e.glossary.push(d.dataset.term); pushExtras(e); }
    }, true);
    app.addEventListener("input", (ev) => {
      if (/** @type {HTMLElement} */ (ev.target).id !== "gq") return;
      glossaryShown = 25;
      const pos = /** @type {HTMLInputElement} */ (ev.target).selectionStart;
      render();
      const q = /** @type {HTMLInputElement} */ ($("#gq")); q.focus(); q.setSelectionRange(pos, pos);
    });
    window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
  }

  backend.boot().then((/** @type {any} */ b) => {
    course = b.course; me = b.me; prog = b.progress;
    $("#title").textContent = course.title;
    $("#tagline").textContent = course.tagline;
    wire(); render();
  }).catch((/** @type {any} */ e) => { $("#main").innerHTML = `<p class="empty">Could not load the dojo: ${esc(e.message)}</p>`; });
})();
</script>
</body>
</html>
